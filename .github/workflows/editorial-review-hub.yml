name: Editorial Review Hub

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Editorial Regression run ID; leave empty to use REVIEW_HUB_SOURCE_RUN_ID or the latest successful run with a valid artifact"
        required: false
        default: ""
        type: string
      target_date:
        description: "Episode date; leave empty to infer from artifact"
        required: false
        default: ""
        type: string
      max_media_downloads:
        description: "Maximum review multimedia assets"
        required: true
        default: "54"
        type: string
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/editorial-review-hub.yml"
      - "pipeline/evidence_reconciliation.py"
      - "pipeline/review_hub.py"
      - "pipeline/review_hub_v2.py"
      - "pipeline/review_hub_v3.py"
      - "pipeline/review_hub_v4.py"
      - "pipeline/review_hub_v5.py"
      - "pipeline/review_hub_v6.py"
      - "pipeline/review_media.py"
      - "pipeline/review_media_offline.py"
      - "pipeline/review_media_density.py"
      - "pipeline/review_media_dense.py"
      - "pipeline/review_media_offline_dense.py"
      - "pipeline/media.py"
      - "tests/test_evidence_reconciliation.py"
      - "tests/test_review_hub.py"
      - "tests/test_review_hub_search.py"
      - "tests/test_review_hub_v3.py"
      - "tests/test_review_hub_v5.py"
      - "tests/test_review_hub_v6.py"
      - "tests/test_review_media_offline.py"
      - "tests/test_review_media_density.py"
      - "evals/editorial/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/editorial-review-hub.yml"
      - "pipeline/evidence_reconciliation.py"
      - "pipeline/review_hub.py"
      - "pipeline/review_hub_v2.py"
      - "pipeline/review_hub_v3.py"
      - "pipeline/review_hub_v4.py"
      - "pipeline/review_hub_v5.py"
      - "pipeline/review_hub_v6.py"
      - "pipeline/review_media.py"
      - "pipeline/review_media_offline.py"
      - "pipeline/review_media_density.py"
      - "pipeline/review_media_dense.py"
      - "pipeline/review_media_offline_dense.py"
      - "pipeline/media.py"
      - "tests/test_review_hub_search.py"
      - "tests/test_review_hub_v3.py"
      - "tests/test_review_hub_v5.py"
      - "tests/test_review_hub_v6.py"
      - "tests/test_review_media_density.py"
      - "evals/editorial/**"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: editorial-review-hub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      target_date: ${{ steps.source.outputs.target_date }}
      source_run_id: ${{ steps.source.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c requirements.lock .

      - name: Resolve and download Editorial Regression artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.source_run_id }}
          INPUT_TARGET_DATE: ${{ inputs.target_date }}
          DEFAULT_RUN_ID: ${{ vars.REVIEW_HUB_SOURCE_RUN_ID }}
        run: |
          set -euo pipefail

          artifact_for_run() {
            local candidate="$1"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/artifacts" \
              --jq '.artifacts | map(select(.expired == false and (.name | startswith("editorial-regression-")))) | sort_by(.created_at) | last | .name' \
              2>/dev/null || true
          }

          RUN_ID="${INPUT_RUN_ID:-$DEFAULT_RUN_ID}"
          ARTIFACT_NAME=""
          if [ -n "$RUN_ID" ]; then
            ARTIFACT_NAME="$(artifact_for_run "$RUN_ID")"
          fi

          if [ -n "${INPUT_RUN_ID:-}" ] && { [ -z "$ARTIFACT_NAME" ] || [ "$ARTIFACT_NAME" = "null" ]; }; then
            echo "Explicit Editorial Regression run $INPUT_RUN_ID has no usable editorial-regression artifact."
            exit 1
          fi

          if [ -z "$ARTIFACT_NAME" ] || [ "$ARTIFACT_NAME" = "null" ]; then
            if [ -n "$RUN_ID" ]; then
              echo "::warning::Configured source run $RUN_ID has no usable artifact; searching recent successful Editorial Regression runs."
            fi
            RUN_ID=""
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              candidate_artifact="$(artifact_for_run "$candidate")"
              if [ -n "$candidate_artifact" ] && [ "$candidate_artifact" != "null" ]; then
                RUN_ID="$candidate"
                ARTIFACT_NAME="$candidate_artifact"
                break
              fi
            done < <(gh run list \
              --workflow 'Editorial Regression' \
              --status success \
              --limit 20 \
              --json databaseId \
              --jq '.[].databaseId')
          fi

          test -n "$RUN_ID" || { echo "No successful Editorial Regression run with a usable artifact found"; exit 1; }
          test -n "$ARTIFACT_NAME" -a "$ARTIFACT_NAME" != "null" || { echo "No editorial-regression artifact found for run $RUN_ID"; exit 1; }

          rm -rf .review-source
          mkdir -p .review-source
          gh run download "$RUN_ID" --name "$ARTIFACT_NAME" --dir .review-source

          EPISODE_DIR=""
          if [ -n "${INPUT_TARGET_DATE:-}" ] && [ -f ".review-source/scripts/$INPUT_TARGET_DATE/script.txt" ]; then
            EPISODE_DIR=".review-source/scripts/$INPUT_TARGET_DATE"
          else
            SCRIPT_PATH="$(find .review-source -type f -path '*/scripts/*/script.txt' | sort | tail -1)"
            test -n "$SCRIPT_PATH" || { echo "Artifact contains no scripts/*/script.txt"; exit 1; }
            EPISODE_DIR="$(dirname "$SCRIPT_PATH")"
          fi
          TARGET_DATE="$(basename "$EPISODE_DIR")"
          REGRESSION_PATH="$(find .review-source -type f -name editorial-regression.json | head -1)"
          test -f "$REGRESSION_PATH" || { echo "Artifact contains no editorial-regression.json"; exit 1; }

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "episode_dir=$EPISODE_DIR" >> "$GITHUB_OUTPUT"
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "regression_path=$REGRESSION_PATH" >> "$GITHUB_OUTPUT"
          echo "Using Editorial Regression run $RUN_ID / $TARGET_DATE / $ARTIFACT_NAME"

      - name: Reconcile high-confidence evidence/source references for review
        env:
          EPISODE_DIR: ${{ steps.source.outputs.episode_dir }}
        run: |
          set -euo pipefail
          python -m pipeline.evidence_reconciliation --episode-dir "$EPISODE_DIR" --write

      - name: Generate dense beat-labelled review multimedia
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-nano' }}
          MEDIA_MIN_RELEVANCE_SCORE: ${{ vars.MEDIA_MIN_RELEVANCE_SCORE || '0.22' }}
          MEDIA_HTTP_MAX_ATTEMPTS: ${{ vars.MEDIA_HTTP_MAX_ATTEMPTS || '3' }}
          MEDIA_HTTP_RETRY_BASE_SECONDS: ${{ vars.MEDIA_HTTP_RETRY_BASE_SECONDS || '1.0' }}
          MAX_MEDIA: ${{ inputs.max_media_downloads }}
          EPISODE_DIR: ${{ steps.source.outputs.episode_dir }}
          TARGET_DATE: ${{ steps.source.outputs.target_date }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          MAX_MEDIA="${MAX_MEDIA:-54}"
          export MAX_MEDIA TARGET_DATE
          rm -rf review-media review-downloads
          mkdir -p review-media review-downloads
          ZIP="review-downloads/multimedia-${TARGET_DATE}-run-${RUN_ID}.zip"

          run_offline() {
            rm -rf "review-media/$TARGET_DATE" "$ZIP"
            python -m pipeline.review_media_offline_dense \
              --episode-dir "$EPISODE_DIR" \
              --output-dir "review-media/$TARGET_DATE" \
              --zip-out "$ZIP" \
              --max-media-downloads "$MAX_MEDIA"
          }

          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::warning::OPENAI_API_KEY unavailable; using deterministic dense multimedia planner"
            run_offline
          else
            set +e
            python -m pipeline.review_media_dense \
              --episode-dir "$EPISODE_DIR" \
              --output-dir "review-media/$TARGET_DATE" \
              --zip-out "$ZIP" \
              --max-media-downloads "$MAX_MEDIA" 2>&1 | tee /tmp/review-media.log
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -ne 0 ]; then
              if grep -Eqi 'credit_balance_exhausted|insufficient_quota|no credits remaining' /tmp/review-media.log; then
                echo "::warning::Model quota unavailable; rebuilding multimedia deterministically with dense cadence"
                run_offline
              else
                exit "$STATUS"
              fi
            fi
          fi

          python - <<'PY'
          import json, os
          from pathlib import Path
          target = os.environ["TARGET_DATE"]
          budget = int(os.environ.get("MAX_MEDIA", "54"))
          manifest = json.loads(Path(f"review-media/{target}/manifest.json").read_text(encoding="utf-8"))
          count = len(manifest)
          videos = sum(1 for item in manifest if item.get("asset_type") == "video")
          images = sum(1 for item in manifest if item.get("asset_type") == "image")
          opening = sum(1 for item in manifest if float(item.get("start_seconds", 0) or 0) < 20)
          floor = min(45, budget)
          print(f"Dense media validation: {count} assets = {videos} video + {images} image; opening={opening}; floor={floor}")
          if budget >= 45 and count < 45:
              raise SystemExit(f"Dense media floor failed: expected >=45 assets, got {count}")
          if opening < 5:
              raise SystemExit(f"Cold-open media floor failed: expected >=5 assets, got {opening}")
          PY

      - name: Build static editorial review site
        env:
          EPISODE_DIR: ${{ steps.source.outputs.episode_dir }}
          REGRESSION_PATH: ${{ steps.source.outputs.regression_path }}
          TARGET_DATE: ${{ steps.source.outputs.target_date }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          ZIP="review-downloads/multimedia-${TARGET_DATE}-run-${RUN_ID}.zip"
          rm -rf review-site
          python -m pipeline.review_hub \
            --episode-dir "$EPISODE_DIR" \
            --media-dir "review-media/$TARGET_DATE" \
            --media-zip "$ZIP" \
            --regression "$REGRESSION_PATH" \
            --cases evals/editorial/cases.json \
            --output-dir review-site \
            --run-id "$RUN_ID"
          test -s review-site/index.html
          test -s "review-site/downloads/$(basename "$ZIP")"
          grep -q 'id="globalSearch"' review-site/index.html
          grep -q 'details class="diagnostic"' review-site/index.html
          grep -q 'class="skip-link"' review-site/index.html
          grep -q "preload='none'" review-site/index.html
          grep -q 'role="tablist"' review-site/index.html
          grep -q 'data-tab="overview"' review-site/index.html
          grep -q 'data-tab="script"' review-site/index.html
          grep -q 'data-tab="evidence"' review-site/index.html
          grep -q 'data-tab="media"' review-site/index.html
          grep -q 'data-tab="technical"' review-site/index.html
          grep -q 'class="source-cards"' review-site/index.html
          grep -q 'data-media-filter="video"' review-site/index.html
          grep -q 'data-media-filter="image"' review-site/index.html

      - name: Upload review hub + multimedia artifact
        uses: actions/upload-artifact@v4
        with:
          name: editorial-review-hub-${{ steps.source.outputs.target_date }}-${{ steps.source.outputs.run_id }}
          path: |
            review-site/
            review-media/
            review-downloads/
          if-no-files-found: error
          retention-days: 30

      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v4
        with:
          path: review-site

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed review hub
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 20 "$PAGE_URL" -o /tmp/review-hub.html \
              && grep -q 'id="globalSearch"' /tmp/review-hub.html \
              && grep -q 'class="skip-link"' /tmp/review-hub.html \
              && grep -q 'data-tab="overview"' /tmp/review-hub.html \
              && grep -q 'data-tab="technical"' /tmp/review-hub.html; then
              echo "GitHub Pages smoke test passed: $PAGE_URL"
              exit 0
            fi
            echo "Pages not ready yet (attempt $attempt/6)"
            sleep 10
          done
          echo "::error::GitHub Pages deployment did not pass smoke test: $PAGE_URL"
          exit 1
