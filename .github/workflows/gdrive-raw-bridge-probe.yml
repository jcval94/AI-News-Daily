name: Google Drive AI News Bridge

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - ".github/workflows/gdrive-raw-bridge-probe.yml"
      - "pipeline/gdrive_news_bridge.py"
      - "pipeline/staged_news_issue.py"
      - "tests/test_gdrive_news_bridge.py"

permissions:
  contents: write

concurrency:
  group: gdrive-ai-news-bridge
  cancel-in-progress: false

jobs:
  consume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INBOX_FOLDER_ID: 1bPEr91j4HDGihnDbcCtoBPFWCW2RPYQ_
      PROCESSED_FOLDER_ID: 1o-2WPz514dFJDg7seGz2dZ4X87doPkdK
      FAILED_FOLDER_ID: 1m03IN_GY0rJgpz_gXtwm1by91GcSOuZz
      FILE_PREFIX: ai-news-daily.news.

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require Drive credential
        shell: bash
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "${GDRIVE_SERVICE_ACCOUNT_JSON:-}" ]]; then
            echo "::error::Missing required secret: GDRIVE_SERVICE_ACCOUNT_JSON"
            exit 2
          fi

      - name: Install bridge dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet google-auth requests
          python -m pip install -c requirements.lock pydantic

      - name: Mint Google Drive token
        id: auth
        shell: bash
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          info = json.loads(os.environ["GDRIVE_SERVICE_ACCOUNT_JSON"])
          creds = service_account.Credentials.from_service_account_info(
              info,
              scopes=["https://www.googleapis.com/auth/drive"],
          )
          creds.refresh(Request())
          print(f"::add-mask::{creds.token}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              print(f"access_token={creds.token}", file=out)
          PY

      - name: Select oldest pending production envelope
        id: select
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ACCESS_TOKEN"
          query="'$INBOX_FOLDER_ID' in parents and trashed=false and mimeType='text/plain' and name contains '$FILE_PREFIX'"
          curl --fail-with-body -sS -G \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            --data-urlencode "q=$query" \
            --data-urlencode "orderBy=createdTime asc" \
            --data-urlencode "fields=files(id,name,createdTime,parents,mimeType)" \
            --data-urlencode "pageSize=1" \
            "https://www.googleapis.com/drive/v3/files" > /tmp/drive-list.json
          python - <<'PY'
          import json, os
          from pathlib import Path

          files = json.loads(Path("/tmp/drive-list.json").read_text()).get("files", [])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              if files:
                  f = files[0]
                  print(f"file_id={f['id']}", file=out)
                  print(f"file_name={f['name']}", file=out)
              else:
                  print("file_id=", file=out)
                  print("file_name=", file=out)
          PY

      - name: Download production envelope
        if: steps.select.outputs.file_id != ''
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ACCESS_TOKEN"
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://www.googleapis.com/drive/v3/files/${{ steps.select.outputs.file_id }}?alt=media" \
            -o /tmp/ai-news-envelope.txt

      - name: Validate envelope and materialize digest
        if: steps.select.outputs.file_id != ''
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m pipeline.gdrive_news_bridge \
            --envelope /tmp/ai-news-envelope.txt \
            --repo "$GITHUB_REPOSITORY" \
            --news-dir news

      - name: Move invalid envelope to failed
        if: steps.select.outputs.file_id != '' && steps.validate.outcome == 'failure'
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X PATCH -G \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            --data-urlencode "addParents=$FAILED_FOLDER_ID" \
            --data-urlencode "removeParents=$INBOX_FOLDER_ID" \
            --data-urlencode "fields=id,name,parents" \
            "https://www.googleapis.com/drive/v3/files/${{ steps.select.outputs.file_id }}" >/dev/null

      - name: Fail invalid envelope
        if: steps.select.outputs.file_id != '' && steps.validate.outcome == 'failure'
        run: exit 1

      - name: Recheck main and commit exactly one digest
        id: publish
        if: steps.select.outputs.file_id != '' && steps.validate.outcome == 'success' && steps.validate.outputs.status == 'created'
        env:
          DIGEST_PATH: ${{ steps.validate.outputs.path }}
          DIGEST_DATE: ${{ steps.validate.outputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          if git ls-tree -r --name-only origin/main -- news/ | grep -Eq "^news/${DIGEST_DATE}(-|\.txt$)"; then
            echo "A digest for ${DIGEST_DATE} already exists on origin/main; refusing duplicate publication."
            rm -f -- "$DIGEST_PATH"
            echo "status=race_existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git rebase origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$DIGEST_PATH"

          mapfile -t STAGED < <(git diff --cached --name-only)
          if [ "${#STAGED[@]}" -ne 1 ] || [ "${STAGED[0]}" != "$DIGEST_PATH" ]; then
            printf 'Refusing commit; staged files were:\n%s\n' "${STAGED[*]}"
            exit 1
          fi

          git commit -m "Add AI news digest for ${DIGEST_DATE} via Drive bridge"
          git push origin HEAD:main
          echo "status=published" >> "$GITHUB_OUTPUT"

      - name: Move consumed envelope to processed
        if: >-
          steps.select.outputs.file_id != '' &&
          steps.validate.outcome == 'success' &&
          (
            steps.validate.outputs.status == 'already_exists' ||
            steps.publish.outputs.status == 'published' ||
            steps.publish.outputs.status == 'race_existing'
          )
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X PATCH -G \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            --data-urlencode "addParents=$PROCESSED_FOLDER_ID" \
            --data-urlencode "removeParents=$INBOX_FOLDER_ID" \
            --data-urlencode "fields=id,name,parents" \
            "https://www.googleapis.com/drive/v3/files/${{ steps.select.outputs.file_id }}" >/dev/null

      - name: Idle
        if: steps.select.outputs.file_id == ''
        run: echo "No pending AI News production envelope found."
