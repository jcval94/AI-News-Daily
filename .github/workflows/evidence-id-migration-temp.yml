name: Temporary Evidence ID Migration

on:
  push:
    branches:
      - fix/high-1-4-editorial-stabilization
    paths:
      - "tools/migrate_evidence_ids.py"
      - "tools/finish_evidence_id_migration.py"
      - ".github/workflows/evidence-id-migration-temp.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tools/migrate_evidence_ids.py"
      - "tools/finish_evidence_id_migration.py"
      - ".github/workflows/evidence-id-migration-temp.yml"

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/high-1-4-editorial-stabilization
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c requirements.lock .
      - name: Apply evidence-id migration
        run: |
          set +e
          python tools/migrate_evidence_ids.py
          MIGRATION_EXIT=$?
          set -e
          if [ "$MIGRATION_EXIT" -ne 0 ]; then
            echo "Primary migration exited after applying transformations; running the narrow metadata finisher before full validation."
          fi
          python tools/finish_evidence_id_migration.py
      - name: Validate migration
        run: |
          python -m compileall app pipeline
          python -c "import app.agent, pipeline.run, pipeline.production_script, pipeline.script_sections; print('runtime imports ok')"
          python -m unittest discover -s tests -v
          if grep -R "evidence_news_indices" app pipeline tests; then
            echo "Ambiguous evidence_news_indices remains"
            exit 1
          fi
          git diff --check
      - name: Commit validated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/agent.py pipeline/run.py pipeline/script_sections.py pipeline/production_script.py \
            tests/test_script_sections.py tests/test_editorial_runtime_contract.py \
            tests/test_production_script.py tests/test_e2e_orchestration.py \
            tests/test_e2e_failure_paths.py tests/test_editorial_regression_runtime.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No migration changes found"
            exit 1
          fi
          git commit -m "fix: use stable evidence IDs across essay beats"
          git pull --rebase origin fix/high-1-4-editorial-stabilization
          git push origin HEAD:fix/high-1-4-editorial-stabilization
