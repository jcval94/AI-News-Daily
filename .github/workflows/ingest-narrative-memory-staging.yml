name: Ingest Narrative Memory Staging

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: narrative-memory-staging-main
  cancel-in-progress: false

jobs:
  ingest:
    if: startsWith(github.event.issue.title, 'NARRATIVE_MEMORY_STAGING — ')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify staging author
        env:
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "$ISSUE_AUTHOR" != "$REPO_OWNER" ]; then
            echo "Ignoring staging issue from $ISSUE_AUTHOR; expected repository owner $REPO_OWNER."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install validator dependency
        run: python -m pip install -c requirements.lock pydantic

      - name: Run staging regression tests
        run: python -m unittest tests.test_staged_narrative_memory_issue tests.test_narrative_memory

      - name: Validate issue against current canonical memory
        run: python -m pipeline.staged_narrative_memory_issue

      - name: Recheck main, append safely, and publish
        id: publish
        shell: bash
        run: |
          set -euo pipefail

          published=0
          final_status=""
          final_ids=""
          final_count="0"

          for attempt in 1 2 3; do
            echo "Publish attempt $attempt/3"
            git fetch origin main
            git reset --hard origin/main

            tmp_output="$RUNNER_TEMP/narrative-memory-output-$attempt"
            : > "$tmp_output"

            if ! GITHUB_OUTPUT="$tmp_output" python -m pipeline.staged_narrative_memory_issue --apply; then
              echo "Revalidation failed against latest main."
              exit 1
            fi

            status="$(grep '^status=' "$tmp_output" | tail -1 | cut -d= -f2-)"
            ids="$(grep '^ids=' "$tmp_output" | tail -1 | cut -d= -f2-)"
            count="$(grep '^added_count=' "$tmp_output" | tail -1 | cut -d= -f2-)"

            if [ "$status" = "already_exists" ]; then
              final_status="already_exists"
              final_ids="$ids"
              final_count="0"
              published=1
              break
            fi

            if [ "$status" != "applied" ]; then
              echo "Unexpected apply status: $status"
              exit 1
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add editorial/narrative_memory.jsonl

            mapfile -t STAGED < <(git diff --cached --name-only)
            if [ "${#STAGED[@]}" -ne 1 ] || [ "${STAGED[0]}" != "editorial/narrative_memory.jsonl" ]; then
              printf 'Refusing commit; staged files were:\n%s\n' "${STAGED[*]}"
              exit 1
            fi

            git commit -m "Append Narrative Memory staging records"

            if git push origin HEAD:main; then
              final_status="published"
              final_ids="$ids"
              final_count="$count"
              published=1
              break
            fi

            echo "Push raced with another main update; retrying from latest main."
          done

          if [ "$published" -ne 1 ]; then
            echo "Could not publish after 3 attempts."
            exit 1
          fi

          echo "status=$final_status" >> "$GITHUB_OUTPUT"
          echo "ids=$final_ids" >> "$GITHUB_OUTPUT"
          echo "added_count=$final_count" >> "$GITHUB_OUTPUT"

      - name: Comment and close successful staging issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          STATUS: ${{ steps.publish.outputs.status }}
          IDS: ${{ steps.publish.outputs.ids }}
          ADDED_COUNT: ${{ steps.publish.outputs.added_count }}
        run: |
          set -euo pipefail
          if [ "$STATUS" = "already_exists" ]; then
            MSG="No se agregó nada: todos los IDs del staging ya existían con contenido idéntico. IDs: $IDS."
          else
            MSG="Narrative Memory validada y publicada: $ADDED_COUNT registro(s) append-only. IDs: $IDS."
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$MSG"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Leave diagnostic comment on failure
        if: failure() && github.event.issue.user.login == github.repository_owner
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Narrative Memory staging no completó todas sus etapas. El issue queda abierto para diagnóstico; antes de reintentar, verifica si el append ya fue publicado."
