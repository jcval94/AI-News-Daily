name: Build AI News Video Kit

on:
  schedule:
    - cron: "0 15 * * 2" # Tuesday 09:00 America/Mexico_City
    - cron: "0 15 * * 5" # Friday 09:00 America/Mexico_City
  workflow_dispatch:
    inputs:
      target_date:
        description: "Script date (YYYY-MM-DD). Must be Tuesday or Friday. Empty = today in Mexico City."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ai-news-video-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-video-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project
        run: python -m pip install .

      - name: Validate deterministic contracts
        run: |
          python -m compileall app pipeline
          python -c "import app.agent, pipeline.run; print('runtime imports ok')"
          python -m unittest discover -s tests -v

      - name: Resolve script date
        id: script_date
        env:
          MANUAL_TARGET_DATE: ${{ inputs.target_date }}
        run: |
          if [ -n "$MANUAL_TARGET_DATE" ]; then
            TARGET_DATE="$MANUAL_TARGET_DATE"
          else
            TARGET_DATE="$(TZ=America/Mexico_City date +%F)"
          fi
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "Script target date: $TARGET_DATE"

      - name: Prepare isolated run workspace
        id: workspace
        env:
          TARGET_DATE: ${{ steps.script_date.outputs.target_date }}
        run: |
          RUN_ROOT=".pipeline-runs/$TARGET_DATE/$GITHUB_RUN_ID"
          rm -rf "$RUN_ROOT"
          mkdir -p "$RUN_ROOT/scripts" "$RUN_ROOT/multimedia"
          echo "run_root=$RUN_ROOT" >> "$GITHUB_OUTPUT"
          echo "Isolated run workspace: $RUN_ROOT"

      - name: Check OpenAI secret
        id: secret_check
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured in repository Actions secrets."
            exit 1
          fi

      - name: Build isolated episode
        id: build
        if: steps.secret_check.outcome == 'success'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-nano' }}
          SCRIPT_QUALITY_THRESHOLD: ${{ vars.SCRIPT_QUALITY_THRESHOLD || '8.7' }}
          JUDGE_THRESHOLD: ${{ vars.JUDGE_THRESHOLD || '8.5' }}
          MAX_REFINEMENT_ITERATIONS: ${{ vars.MAX_REFINEMENT_ITERATIONS || '5' }}
          MAX_SELECTED_NEWS: "8"
          MAX_MEDIA_DOWNLOADS: ${{ vars.MAX_MEDIA_DOWNLOADS || '12' }}
          DOWNLOAD_MULTIMEDIA: ${{ vars.DOWNLOAD_MULTIMEDIA || 'true' }}
          SELECTION_HISTORY_DAYS: ${{ vars.SELECTION_HISTORY_DAYS || '30' }}
          TARGET_MIN_SECONDS: ${{ vars.TARGET_MIN_SECONDS || '420' }}
          TARGET_MAX_SECONDS: ${{ vars.TARGET_MAX_SECONDS || '720' }}
          WORDS_PER_SECOND: ${{ vars.WORDS_PER_SECOND || '2.5' }}
          AGENT_MAX_ATTEMPTS: ${{ vars.AGENT_MAX_ATTEMPTS || '3' }}
          AGENT_RETRY_BASE_SECONDS: ${{ vars.AGENT_RETRY_BASE_SECONDS || '2.0' }}
          MEDIA_HTTP_MAX_ATTEMPTS: ${{ vars.MEDIA_HTTP_MAX_ATTEMPTS || '3' }}
          RUN_ROOT: ${{ steps.workspace.outputs.run_root }}
        run: |
          python -m pipeline.run \
            --target-date "${{ steps.script_date.outputs.target_date }}" \
            --scripts-dir "$RUN_ROOT/scripts" \
            --multimedia-dir "$RUN_ROOT/multimedia" \
            --history-scripts-dir scripts \
            --max-media-downloads "$MAX_MEDIA_DOWNLOADS"

      - name: Determine episode outcome
        id: episode_outcome
        if: always()
        env:
          TARGET_DATE: ${{ steps.script_date.outputs.target_date }}
          RUN_ROOT: ${{ steps.workspace.outputs.run_root }}
          SECRET_OUTCOME: ${{ steps.secret_check.outcome }}
          BUILD_STEP_OUTCOME: ${{ steps.build.outcome }}
        run: |
          STATE_FILE="$RUN_ROOT/scripts/$TARGET_DATE/run_state.json"
          if [ "$SECRET_OUTCOME" != "success" ]; then
            STATUS="missing_openai_secret"
          elif [ -f "$STATE_FILE" ]; then
            STATUS="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["status"])' "$STATE_FILE")"
          elif [ "$BUILD_STEP_OUTCOME" = "failure" ]; then
            STATUS="failure"
          else
            STATUS="failure"
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Episode outcome: $STATUS"

      - name: Create run report
        id: report
        if: always()
        env:
          EPISODE_RUN_ID: ${{ github.run_id }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-nano' }}
          SCRIPT_QUALITY_THRESHOLD: ${{ vars.SCRIPT_QUALITY_THRESHOLD || '8.7' }}
          JUDGE_THRESHOLD: ${{ vars.JUDGE_THRESHOLD || '8.5' }}
          MAX_REFINEMENT_ITERATIONS: ${{ vars.MAX_REFINEMENT_ITERATIONS || '5' }}
          MAX_SELECTED_NEWS: "8"
          MAX_MEDIA_DOWNLOADS: ${{ vars.MAX_MEDIA_DOWNLOADS || '12' }}
          DOWNLOAD_MULTIMEDIA: ${{ vars.DOWNLOAD_MULTIMEDIA || 'true' }}
          SELECTION_HISTORY_DAYS: ${{ vars.SELECTION_HISTORY_DAYS || '30' }}
          TARGET_MIN_SECONDS: ${{ vars.TARGET_MIN_SECONDS || '420' }}
          TARGET_MAX_SECONDS: ${{ vars.TARGET_MAX_SECONDS || '720' }}
          WORDS_PER_SECOND: ${{ vars.WORDS_PER_SECOND || '2.5' }}
          AGENT_MAX_ATTEMPTS: ${{ vars.AGENT_MAX_ATTEMPTS || '3' }}
          AGENT_RETRY_BASE_SECONDS: ${{ vars.AGENT_RETRY_BASE_SECONDS || '2.0' }}
          RUN_ROOT: ${{ steps.workspace.outputs.run_root }}
        run: |
          python -m pipeline.report \
            --target-date "${{ steps.script_date.outputs.target_date }}" \
            --build-outcome "${{ steps.episode_outcome.outputs.status }}" \
            --scripts-dir "$RUN_ROOT/scripts" \
            --multimedia-dir "$RUN_ROOT/multimedia"

      - name: Refresh branch before promotion
        if: steps.episode_outcome.outputs.status == 'approved' && steps.report.outcome == 'success'
        run: git pull --rebase origin "$GITHUB_REF_NAME"

      - name: Promote approved episode
        id: promote
        if: steps.episode_outcome.outputs.status == 'approved' && steps.report.outcome == 'success'
        env:
          TARGET_DATE: ${{ steps.script_date.outputs.target_date }}
          RUN_ROOT: ${{ steps.workspace.outputs.run_root }}
        run: |
          rm -rf "scripts/$TARGET_DATE" "multimedia/$TARGET_DATE"
          cp -R "$RUN_ROOT/scripts/$TARGET_DATE" "scripts/$TARGET_DATE"
          if [ -d "$RUN_ROOT/multimedia/$TARGET_DATE" ]; then
            cp -R "$RUN_ROOT/multimedia/$TARGET_DATE" "multimedia/$TARGET_DATE"
          fi
          echo "promoted=true" >> "$GITHUB_OUTPUT"

      - name: Commit approved canonical artifacts
        if: steps.promote.outputs.promoted == 'true'
        env:
          TARGET_DATE: ${{ steps.script_date.outputs.target_date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "scripts/$TARGET_DATE" "multimedia/$TARGET_DATE"
          if git diff --cached --quiet; then
            echo "No canonical episode changes to commit."
            exit 0
          fi
          git commit -m "content: publish approved AI news kit for $TARGET_DATE"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload isolated run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-run-${{ steps.script_date.outputs.target_date }}-${{ github.run_id }}
          path: ${{ steps.workspace.outputs.run_root }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Propagate non-publishable outcome
        if: >-
          steps.episode_outcome.outputs.status == 'missing_openai_secret' ||
          steps.episode_outcome.outputs.status == 'failure' ||
          steps.episode_outcome.outputs.status == 'script_not_approved' ||
          steps.report.outcome == 'failure'
        run: |
          echo "Episode outcome: ${{ steps.episode_outcome.outputs.status }}"
          echo "Run artifacts were preserved; nothing non-approved was promoted."
          exit 1
