name: Google Drive AI News Bridge

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - ".github/workflows/gdrive-raw-bridge-probe.yml"
      - "pipeline/gdrive_news_bridge.py"
      - "pipeline/staged_news_issue.py"
      - "tests/test_gdrive_news_bridge.py"

permissions:
  contents: write

concurrency:
  group: gdrive-ai-news-bridge
  cancel-in-progress: false

jobs:
  consume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INBOX_FOLDER_ID: 1bPEr91j4HDGihnDbcCtoBPFWCW2RPYQ_
      PROCESSED_FOLDER_ID: 1o-2WPz514dFJDg7seGz2dZ4X87doPkdK
      FAILED_FOLDER_ID: 1m03IN_GY0rJgpz_gXtwm1by91GcSOuZz
      SHEET_PREFIX: __bridge_inbox_AI-News-Daily__
      RAW_PREFIX: ai-news-daily.news.

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require Drive credential
        shell: bash
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "${GDRIVE_SERVICE_ACCOUNT_JSON:-}" ]]; then
            echo "::error::Missing required secret: GDRIVE_SERVICE_ACCOUNT_JSON"
            exit 2
          fi

      - name: Install bridge dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet google-auth requests
          python -m pip install -c requirements.lock pydantic

      - name: Mint Google Drive and Sheets token
        id: auth
        shell: bash
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          info = json.loads(os.environ["GDRIVE_SERVICE_ACCOUNT_JSON"])
          creds = service_account.Credentials.from_service_account_info(
              info,
              scopes=["https://www.googleapis.com/auth/drive"],
          )
          creds.refresh(Request())
          print(f"::add-mask::{creds.token}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              print(f"access_token={creds.token}", file=out)
          PY

      - name: Select oldest pending AI News handoff
        id: select
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ACCESS_TOKEN"
          query="'$INBOX_FOLDER_ID' in parents and trashed=false"
          curl --fail-with-body -sS -G \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            --data-urlencode "q=$query" \
            --data-urlencode "orderBy=createdTime asc" \
            --data-urlencode "fields=files(id,name,createdTime,parents,mimeType)" \
            --data-urlencode "pageSize=100" \
            "https://www.googleapis.com/drive/v3/files" > /tmp/drive-list.json
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          candidates = json.loads(Path("/tmp/drive-list.json").read_text()).get("files", [])
          sheet_prefix = os.environ["SHEET_PREFIX"]
          # The shared prefix also contains weekly and Narrative Memory lanes.
          daily_sheet_re = re.compile(re.escape(sheet_prefix) + r"[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{6}")
          raw_prefix = os.environ["RAW_PREFIX"]
          eligible = []
          for f in candidates:
              name = str(f.get("name") or "")
              mime = str(f.get("mimeType") or "")
              if mime == "application/vnd.google-apps.spreadsheet" and daily_sheet_re.fullmatch(name):
                  eligible.append((str(f.get("createdTime") or ""), 0, "sheet", f))
              elif mime == "text/plain" and name.startswith(raw_prefix):
                  eligible.append((str(f.get("createdTime") or ""), 1, "raw", f))
          eligible.sort(key=lambda x: (x[0], x[1]))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              if eligible:
                  _, _, kind, f = eligible[0]
                  print(f"file_id={f['id']}", file=out)
                  print(f"file_name={f['name']}", file=out)
                  print(f"file_kind={kind}", file=out)
              else:
                  print("file_id=", file=out)
                  print("file_name=", file=out)
                  print("file_kind=", file=out)
          PY

      - name: Convert Sheet handoff to verified envelope
        if: steps.select.outputs.file_kind == 'sheet'
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FILE_ID: ${{ steps.select.outputs.file_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import csv
          import hashlib
          import io
          import os
          import re

          import requests

          token = os.environ["ACCESS_TOKEN"]
          file_id = os.environ["FILE_ID"]
          headers = {"Authorization": f"Bearer {token}"}

          export = requests.get(
              f"https://www.googleapis.com/drive/v3/files/{file_id}/export",
              headers=headers,
              params={"mimeType": "text/csv"},
              timeout=30,
          )
          if not export.ok:
              raise SystemExit(
                  f"Drive CSV export failed: {export.status_code} {export.text[:500]}"
              )

          rows = list(csv.reader(io.StringIO(export.content.decode("utf-8-sig"))))
          keys = [
              "format",
              "message_id",
              "namespace",
              "target_repo",
              "target_path",
              "content_type",
              "status",
              "payload",
          ]
          if len(rows) != 8 or any(len(row) != 2 for row in rows):
              raise SystemExit(f"A1:B8 shape mismatch: {rows!r}")
          got_keys = [str(row[0]) for row in rows]
          if got_keys != keys:
              raise SystemExit(f"A1:A8 keys mismatch: {got_keys!r}")

          kv = {str(k): str(v) for k, v in rows}
          if kv["format"] != "bridge-sheet-v1":
              raise SystemExit("format must be bridge-sheet-v1")
          if kv["namespace"] != "AI-News-Daily":
              raise SystemExit("namespace must be AI-News-Daily")
          if kv["target_repo"] != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("target_repo mismatch")
          if not kv["message_id"].startswith("ai-news-daily.news."):
              raise SystemExit("message_id outside daily news namespace")
          if not re.fullmatch(r"news/[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2}\.txt", kv["target_path"]):
              raise SystemExit("target_path must be news/YYYY-MM-DD-HH-MM-SS.txt")
          if kv["content_type"] != "text/plain":
              raise SystemExit("content_type must be text/plain")
          if kv["status"] != "ready":
              raise SystemExit("status must be ready")
          if not kv["payload"]:
              raise SystemExit("payload is empty")

          payload_bytes = kv["payload"].encode("utf-8")
          envelope = "\n".join([
              "format=base64-payload-v1",
              "schema_version=1.0",
              "message_id=" + kv["message_id"],
              "target_repo=" + kv["target_repo"],
              "target_path=" + kv["target_path"],
              "content_type=" + kv["content_type"],
              "sha256=" + hashlib.sha256(payload_bytes).hexdigest(),
              "payload_b64=" + base64.b64encode(payload_bytes).decode("ascii"),
              "",
          ])
          with open("/tmp/ai-news-envelope.txt", "w", encoding="utf-8") as fh:
              fh.write(envelope)
          PY

      - name: Download raw production envelope
        if: steps.select.outputs.file_kind == 'raw'
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ACCESS_TOKEN"
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://www.googleapis.com/drive/v3/files/${{ steps.select.outputs.file_id }}?alt=media" \
            -o /tmp/ai-news-envelope.txt

      - name: Validate handoff and materialize digest
        if: steps.select.outputs.file_id != ''
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m pipeline.gdrive_news_bridge \
            --envelope /tmp/ai-news-envelope.txt \
            --repo "$GITHUB_REPOSITORY" \
            --news-dir news

      - name: Move invalid handoff to failed
        if: steps.select.outputs.file_id != '' && steps.validate.outcome == 'failure'
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FILE_ID: ${{ steps.select.outputs.file_id }}
          FILE_NAME: ${{ steps.select.outputs.file_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import requests

          token = os.environ["ACCESS_TOKEN"]
          file_id = os.environ["FILE_ID"]
          file_name = os.environ["FILE_NAME"]
          r = requests.patch(
              f"https://www.googleapis.com/drive/v3/files/{file_id}",
              headers={"Authorization": f"Bearer {token}"},
              params={
                  "addParents": os.environ["FAILED_FOLDER_ID"],
                  "removeParents": os.environ["INBOX_FOLDER_ID"],
                  "fields": "id,name,parents",
              },
              json={"name": "failed__" + file_name},
              timeout=30,
          )
          r.raise_for_status()
          PY

      - name: Fail invalid handoff
        if: steps.select.outputs.file_id != '' && steps.validate.outcome == 'failure'
        run: exit 1

      - name: Recheck main and commit exactly one digest
        id: publish
        if: steps.select.outputs.file_id != '' && steps.validate.outcome == 'success' && steps.validate.outputs.status == 'created'
        env:
          DIGEST_PATH: ${{ steps.validate.outputs.path }}
          DIGEST_DATE: ${{ steps.validate.outputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          if git ls-tree -r --name-only origin/main -- news/ | grep -Eq "^news/${DIGEST_DATE}(-|\.txt$)"; then
            echo "A digest for ${DIGEST_DATE} already exists on origin/main; refusing duplicate publication."
            rm -f -- "$DIGEST_PATH"
            echo "status=race_existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git rebase origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$DIGEST_PATH"

          mapfile -t STAGED < <(git diff --cached --name-only)
          if [ "${#STAGED[@]}" -ne 1 ] || [ "${STAGED[0]}" != "$DIGEST_PATH" ]; then
            printf 'Refusing commit; staged files were:\n%s\n' "${STAGED[*]}"
            exit 1
          fi

          git commit -m "Add AI news digest for ${DIGEST_DATE} via Drive bridge"
          git push origin HEAD:main
          echo "status=published" >> "$GITHUB_OUTPUT"

      - name: Move consumed handoff to processed
        if: >-
          steps.select.outputs.file_id != '' &&
          steps.validate.outcome == 'success' &&
          (
            steps.validate.outputs.status == 'already_exists' ||
            steps.publish.outputs.status == 'published' ||
            steps.publish.outputs.status == 'race_existing'
          )
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FILE_ID: ${{ steps.select.outputs.file_id }}
          FILE_NAME: ${{ steps.select.outputs.file_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import requests

          token = os.environ["ACCESS_TOKEN"]
          file_id = os.environ["FILE_ID"]
          file_name = os.environ["FILE_NAME"]
          r = requests.patch(
              f"https://www.googleapis.com/drive/v3/files/{file_id}",
              headers={"Authorization": f"Bearer {token}"},
              params={
                  "addParents": os.environ["PROCESSED_FOLDER_ID"],
                  "removeParents": os.environ["INBOX_FOLDER_ID"],
                  "fields": "id,name,parents",
              },
              json={"name": "processed__" + file_name},
              timeout=30,
          )
          r.raise_for_status()
          PY

      - name: Idle
        if: steps.select.outputs.file_id == ''
        run: echo "No pending AI News production handoff found."
