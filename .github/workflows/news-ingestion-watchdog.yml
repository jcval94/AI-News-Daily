name: News Ingestion Watchdog

on:
  schedule:
    - cron: "30 16 * * *" # 10:30 America/Mexico_City: early missing-ingestion detection
    - cron: "0 20 * * *"  # 14:00 America/Mexico_City: same-day recovery verification
  workflow_run:
    # Reuse surviving native wakeups. The watchdog itself is deliberately excluded.
    workflows: ["Google Drive AI News Bridge", "Google Drive Weekly Research Bridge", "Google Drive Narrative Memory Bridge", "CI", "Production Preflight"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      date:
        description: "Digest date to verify (YYYY-MM-DD); empty means today"
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/news-ingestion-watchdog.yml"
      - "pipeline/gdrive_bridge_reconcile.py"
      - "pipeline/gdrive_bridge_io.py"
      - "tests/test_gdrive_bridge_reconcile.py"
      - "news/**"
      - "pipeline/news_ingestion_health.py"
      - "tests/test_news_ingestion_health.py"

permissions:
  contents: read
  issues: write

concurrency:
  group: news-ingestion-watchdog-${{ inputs.date || 'today' }}
  cancel-in-progress: false

jobs:
  reconcile-drive:
    if: >-
      github.ref == 'refs/heads/main' && inputs.date == '' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    concurrency:
      group: drive-handoff-reconcile-main
      cancel-in-progress: false
    env:
      INBOX_FOLDER_ID: 1bPEr91j4HDGihnDbcCtoBPFWCW2RPYQ_
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Drive dependencies
        run: python -m pip install --disable-pip-version-check --quiet google-auth requests
      - name: Mint read-only Drive token
        id: auth
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          python - <<'PYTOKEN'
          import json, os
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          secret = os.environ.get("GDRIVE_SERVICE_ACCOUNT_JSON")
          if not secret:
              raise SystemExit("Missing required Drive credential")
          creds = service_account.Credentials.from_service_account_info(
              json.loads(secret), scopes=["https://www.googleapis.com/auth/drive.readonly"])
          creds.refresh(Request())
          print(f"::add-mask::{creds.token}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              print(f"access_token={creds.token}", file=out)
          PYTOKEN
      - name: Reconcile pending handoffs and request bounded wakeups
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GH_TOKEN: ${{ github.token }}
        run: python -m pipeline.gdrive_bridge_reconcile --repo "$GITHUB_REPOSITORY" --output drive-reconcile-report.json
      - name: Preserve reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drive-reconcile-${{ github.run_id }}
          path: drive-reconcile-report.json
          if-no-files-found: warn
          retention-days: 14

  watchdog:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install project
        run: python -m pip install -c requirements.lock .
      - name: Verify today's digest
        id: health
        continue-on-error: true
        env:
          DIGEST_DATE: ${{ inputs.date }}
        run: python -m pipeline.news_ingestion_health --date "$DIGEST_DATE" --output news-ingestion-health.json
      - name: Publish watchdog summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('news-ingestion-health.json')
          if not path.is_file():
              raise SystemExit(0)
          data = json.loads(path.read_text(encoding='utf-8'))
          lines = [
              '# News Ingestion Watchdog',
              f"- Date: **{data.get('date')}**",
              f"- Status: **{data.get('status')}**",
              f"- Selected file: **{data.get('selected_file') or 'none'}**",
              f"- Items: **{data.get('item_count', 0)}**",
              f"- Reason: {data.get('reason', '')}",
          ]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
              handle.write('\n'.join(lines) + '\n')
          PY
      - name: Open or update missing-ingestion incident
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST_DATE: ${{ steps.health.outputs.date }}
        run: |
          set -euo pipefail
          TITLE="NEWS_INGESTION_MISSING — ${DIGEST_DATE:-unknown}"
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('news-ingestion-health.json').read_text(encoding='utf-8'))
          lines = [
              'La entrada diaria de noticias no cumplió el contrato esperado.',
              '',
              f"- Fecha: `{data.get('date')}`",
              f"- Estado: `{data.get('status')}`",
              f"- Candidatos: `{data.get('candidate_count', 0)}`",
              f"- Archivo seleccionado: `{data.get('selected_file') or 'ninguno'}`",
              f"- Razón: {data.get('reason', '')}",
              '',
              'Revisar la tarea externa `AI News Daily` y el workflow `Google Drive AI News Bridge`.'
          ]
          Path('/tmp/news-ingestion-body.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          NUMBER="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)"
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/news-ingestion-body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file /tmp/news-ingestion-body.md
          fi
      - name: Close recovered ingestion incident
        if: steps.health.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST_DATE: ${{ steps.health.outputs.date }}
        run: |
          set -euo pipefail
          TITLE="NEWS_INGESTION_MISSING — ${DIGEST_DATE}"
          NUMBER="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)"
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "Ingesta recuperada: el digest del día ya existe y pasa el contrato mínimo."
            gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
          fi
      - name: Upload watchdog evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-ingestion-health-${{ steps.health.outputs.date || 'unknown' }}
          path: news-ingestion-health.json
          if-no-files-found: error
          retention-days: 14
      - name: Propagate ingestion failure
        if: steps.health.outcome == 'failure'
        run: echo "::error::Daily AI News ingestion is missing or invalid." && exit 1
