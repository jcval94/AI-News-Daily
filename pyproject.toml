[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-news-daily"
version = "0.3.0"
description = "Production-oriented agentic AI-news script and multimedia pipeline with Google ADK + OpenAI"
requires-python = ">=3.11"
dependencies = [
  "google-adk==2.6.3",
  "google-genai>=2.9,<3.0",
  "litellm>=1.75.0,<2.0.0",
  "openai>=2.0.0,<3.0.0",
  "pydantic>=2.8,<3.0",
  "requests>=2.32,<3.0",
  "Pillow>=10.4,<13.0",
]

[tool.setuptools]
packages = ["app", "pipeline"]
