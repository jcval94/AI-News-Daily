name: Temporary Critical Hardening

on:
  push:
    branches:
      - fix/critical-editorial-dedup-hardening
    paths:
      - tools/apply_critical_hardening.py
      - .github/workflows/critical-hardening-temp.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install .
      - name: Apply scoped hardening
        run: python tools/apply_critical_hardening.py
      - name: Validate
        run: |
          python -m compileall app pipeline
          python -c "import app.agent, pipeline.run, pipeline.production_script; print('runtime imports ok')"
          python -m unittest discover -s tests -v
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/agent.py \
            pipeline/run.py \
            .github/workflows/build-video-kit.yml \
            tests/test_e2e_orchestration.py \
            tests/test_essay_first_contract.py \
            tests/test_selection_history.py \
            tests/test_promotion_guard.py
          git diff --cached --check
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "fix: harden dramaturgy promotion and covered-story history"
          git push origin "HEAD:${GITHUB_REF_NAME}"
