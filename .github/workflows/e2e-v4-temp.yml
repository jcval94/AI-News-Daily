name: Temporary Editorial E2E V4

on:
  push:
    branches:
      - fix/high-1-4-editorial-stabilization
    paths:
      - ".github/workflows/e2e-v4-temp.yml"

permissions:
  contents: write

jobs:
  e2e-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/high-1-4-editorial-stabilization
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c requirements.lock .

      - name: Require OpenAI secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY"

      - name: Run script-only E2E
        id: build
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-nano' }}
          SCRIPT_QUALITY_THRESHOLD: ${{ vars.SCRIPT_QUALITY_THRESHOLD || '8.7' }}
          JUDGE_THRESHOLD: ${{ vars.JUDGE_THRESHOLD || '8.5' }}
          VOICE_THRESHOLD: ${{ vars.VOICE_THRESHOLD || '8.7' }}
          MAX_REFINEMENT_ITERATIONS: ${{ vars.MAX_REFINEMENT_ITERATIONS || '5' }}
          MAX_SELECTED_NEWS: ${{ vars.MAX_SELECTED_NEWS || '8' }}
          SELECTION_HISTORY_DAYS: ${{ vars.SELECTION_HISTORY_DAYS || '30' }}
          ESSAY_HISTORY_DAYS: ${{ vars.ESSAY_HISTORY_DAYS || '120' }}
          MAX_RECENT_ESSAYS: ${{ vars.MAX_RECENT_ESSAYS || '12' }}
          ESSAY_DUPLICATE_THRESHOLD: ${{ vars.ESSAY_DUPLICATE_THRESHOLD || '0.42' }}
          MAX_NOVELTY_REPLANS: ${{ vars.MAX_NOVELTY_REPLANS || '2' }}
          TARGET_MIN_SECONDS: ${{ vars.TARGET_MIN_SECONDS || '420' }}
          TARGET_MAX_SECONDS: ${{ vars.TARGET_MAX_SECONDS || '1200' }}
          WORDS_PER_SECOND: ${{ vars.WORDS_PER_SECOND || '2.5' }}
          AGENT_MAX_ATTEMPTS: ${{ vars.AGENT_MAX_ATTEMPTS || '3' }}
          AGENT_RETRY_BASE_SECONDS: ${{ vars.AGENT_RETRY_BASE_SECONDS || '2.0' }}
          NEWS_SOURCE_MODE: recent_window
          NEWS_LOOKBACK_DAYS: "4"
          DOWNLOAD_MULTIMEDIA: "false"
          RUN_ROOT: .e2e-v4-work
        run: |
          rm -rf "$RUN_ROOT" .e2e-review/v4
          mkdir -p "$RUN_ROOT/scripts" "$RUN_ROOT/multimedia"
          python -m pipeline.run \
            --target-date 2026-08-21 \
            --scripts-dir "$RUN_ROOT/scripts" \
            --multimedia-dir "$RUN_ROOT/multimedia" \
            --history-scripts-dir scripts \
            --editorial-dir editorial \
            --max-media-downloads 0 \
            --no-download-multimedia

      - name: Evaluate generated essay
        if: always()
        continue-on-error: true
        run: |
          mkdir -p .e2e-review/v4
          python -m pipeline.editorial_regression \
            --episode-dir .e2e-v4-work/scripts/2026-08-21 \
            --output .e2e-review/v4/editorial-regression.json || true
          for file in selected_news.json episode_plan.json novelty_check.json script.txt script_sections.json reviews.json run_state.json; do
            src=".e2e-v4-work/scripts/2026-08-21/$file"
            if [ -f "$src" ]; then cp "$src" ".e2e-review/v4/$file"; fi
          done
          printf '{"build_step_outcome":"%s","workflow_run_id":"%s","git_sha":"%s"}\n' \
            "${{ steps.build.outcome }}" "$GITHUB_RUN_ID" "$GITHUB_SHA" > .e2e-review/v4/workflow.json

      - name: Commit review artifacts to branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .e2e-review/v4
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No E2E review artifacts produced"
            exit 1
          fi
          git commit -m "test: capture editorial E2E v4 for review"
          git pull --rebase origin fix/high-1-4-editorial-stabilization
          git push origin HEAD:fix/high-1-4-editorial-stabilization
