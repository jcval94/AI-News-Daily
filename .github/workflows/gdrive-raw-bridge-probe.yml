name: Google Drive Apps Script Bridge Probe

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - ".github/workflows/gdrive-raw-bridge-probe.yml"

permissions:
  contents: write

concurrency:
  group: gdrive-appscript-bridge-probe
  cancel-in-progress: false

jobs:
  consume:
    runs-on: ubuntu-latest
    env:
      INBOX_FOLDER_ID: 1bPEr91j4HDGihnDbcCtoBPFWCW2RPYQ_
      PROCESSED_FOLDER_ID: 1o-2WPz514dFJDg7seGz2dZ4X87doPkdK
      FAILED_FOLDER_ID: 1m03IN_GY0rJgpz_gXtwm1by91GcSOuZz
      EXPECTED_FILE_NAME: ai-news-daily__apps-script-e2e__2026-10-01-1752.txt
      EXPECTED_MESSAGE_ID: ai-news-daily__apps-script-e2e__2026-10-01-1752
      EXPECTED_TARGET_PATH: bridge-consumed/ai-news-daily-appscript-e2e-2026-10-01-1752.txt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Drive credential
        shell: bash
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "${GDRIVE_SERVICE_ACCOUNT_JSON:-}" ]]; then
            echo "::error::Missing required secret: GDRIVE_SERVICE_ACCOUNT_JSON"
            exit 2
          fi

      - name: Install Google auth client
        shell: bash
        run: python -m pip install --disable-pip-version-check --quiet google-auth requests

      - name: Mint Google Drive token
        id: auth
        shell: bash
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          info = json.loads(os.environ["GDRIVE_SERVICE_ACCOUNT_JSON"])
          creds = service_account.Credentials.from_service_account_info(
              info,
              scopes=["https://www.googleapis.com/auth/drive"],
          )
          creds.refresh(Request())
          print(f"::add-mask::{creds.token}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              print(f"access_token={creds.token}", file=out)
          PY

      - name: Select exact pending bridge TXT
        id: select
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ACCESS_TOKEN"
          query="'$INBOX_FOLDER_ID' in parents and trashed=false and mimeType='text/plain' and name='$EXPECTED_FILE_NAME'"
          curl --fail-with-body -sS -G \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            --data-urlencode "q=$query" \
            --data-urlencode "fields=files(id,name,createdTime,parents,mimeType)" \
            --data-urlencode "pageSize=10" \
            "https://www.googleapis.com/drive/v3/files" > /tmp/drive-list.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          files = json.loads(Path('/tmp/drive-list.json').read_text()).get('files', [])
          if len(files) > 1:
              raise SystemExit(f"Expected at most one matching bridge file, got {len(files)}")
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              if files:
                  f = files[0]
                  print(f"file_id={f['id']}", file=out)
                  print(f"file_name={f['name']}", file=out)
              else:
                  print("file_id=", file=out)
                  print("file_name=", file=out)
          PY

      - name: Download bridge TXT
        if: steps.select.outputs.file_id != ''
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ACCESS_TOKEN"
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://www.googleapis.com/drive/v3/files/${{ steps.select.outputs.file_id }}?alt=media" \
            -o /tmp/bridge-envelope.txt

      - name: Validate envelope and materialize payload
        if: steps.select.outputs.file_id != ''
        id: validate
        continue-on-error: true
        shell: bash
        env:
          SOURCE_FILE_ID: ${{ steps.select.outputs.file_id }}
          SOURCE_FILE_NAME: ${{ steps.select.outputs.file_name }}
        run: |
          set -euo pipefail
          python - "$GITHUB_REPOSITORY" "$EXPECTED_MESSAGE_ID" "$EXPECTED_TARGET_PATH" <<'PY'
          import base64, hashlib, pathlib, sys

          expected_repo, expected_message_id, expected_target_path = sys.argv[1:4]
          raw = pathlib.Path('/tmp/bridge-envelope.txt').read_text(encoding='utf-8-sig')
          env = {}
          for raw_line in raw.splitlines():
              line = raw_line.strip()
              if not line:
                  continue
              if '=' not in line:
                  raise SystemExit(f"Malformed line: {line!r}")
              key, value = line.split('=', 1)
              if key in env:
                  raise SystemExit(f"Duplicate key: {key}")
              env[key] = value

          required = {
              'format','schema_version','message_id','target_repo',
              'target_path','content_type','sha256','payload_b64'
          }
          if set(env) != required:
              raise SystemExit(f"Envelope keys mismatch: got={sorted(env)} expected={sorted(required)}")
          if env['format'] != 'base64-payload-v1':
              raise SystemExit('Unsupported format')
          if env['schema_version'] != '1.0':
              raise SystemExit('Unsupported schema_version')
          if env['message_id'] != expected_message_id:
              raise SystemExit('message_id mismatch')
          if env['target_repo'] != expected_repo:
              raise SystemExit(f"target_repo mismatch: {env['target_repo']} != {expected_repo}")
          if env['target_path'] != expected_target_path:
              raise SystemExit('target_path mismatch')
          if env['content_type'] != 'text/plain':
              raise SystemExit('content_type mismatch')

          target = pathlib.PurePosixPath(env['target_path'])
          if target.is_absolute() or '..' in target.parts:
              raise SystemExit('Unsafe target_path')
          if not env['target_path'].startswith('bridge-consumed/'):
              raise SystemExit('Target outside isolated bridge-consumed/')

          payload = base64.b64decode(env['payload_b64'], validate=True)
          actual_sha = hashlib.sha256(payload).hexdigest()
          if actual_sha != env['sha256']:
              raise SystemExit(f"SHA mismatch: {actual_sha} != {env['sha256']}")

          expected_payload = (
              "AI_NEWS_APPS_SCRIPT_BRIDGE_E2E_2026-10-01_1752\n"
              "source=chatgpt_scheduled_task\n"
              "transport=google_apps_script\n"
              "status=ready\n"
          ).encode('utf-8')
          if payload != expected_payload:
              raise SystemExit(f"Payload mismatch: {payload!r}")

          out = pathlib.Path(env['target_path'])
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(payload)
          print(f"validated={out} sha256={actual_sha}")
          PY

      - name: Move invalid payload to failed
        if: steps.select.outputs.file_id != '' && steps.validate.outcome == 'failure'
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X PATCH -G \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            --data-urlencode "addParents=$FAILED_FOLDER_ID" \
            --data-urlencode "removeParents=$INBOX_FOLDER_ID" \
            --data-urlencode "fields=id,name,parents" \
            "https://www.googleapis.com/drive/v3/files/${{ steps.select.outputs.file_id }}" >/dev/null

      - name: Fail invalid payload
        if: steps.select.outputs.file_id != '' && steps.validate.outcome == 'failure'
        run: exit 1

      - name: Commit materialized payload
        if: steps.select.outputs.file_id != '' && steps.validate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bridge-consumed/
          if git diff --cached --quiet; then
            echo "Payload already materialized; no commit needed."
          else
            git commit -m "test: consume Apps Script bridge probe 17:52"
            git push
          fi

      - name: Move successful payload to processed
        if: steps.select.outputs.file_id != '' && steps.validate.outcome == 'success'
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X PATCH -G \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            --data-urlencode "addParents=$PROCESSED_FOLDER_ID" \
            --data-urlencode "removeParents=$INBOX_FOLDER_ID" \
            --data-urlencode "fields=id,name,parents" \
            "https://www.googleapis.com/drive/v3/files/${{ steps.select.outputs.file_id }}" >/dev/null

      - name: Idle
        if: steps.select.outputs.file_id == ''
        run: echo "No 17:52 Apps Script bridge payload found yet."
