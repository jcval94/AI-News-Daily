name: Build AI News Video Kit

on:
  schedule:
    - cron: "0 15 * * 2" # Tuesday 09:00 America/Mexico_City
    - cron: "0 15 * * 5" # Friday 09:00 America/Mexico_City
  workflow_dispatch:
    inputs:
      target_date:
        description: "Episode date (YYYY-MM-DD). Empty = today in Mexico City. Any date works with recent_window; scheduled_window requires Tuesday/Friday."
        required: false
        type: string
      source_mode:
        description: "Which news window should feed this manual episode?"
        required: true
        default: recent_window
        type: choice
        options:
          - recent_window
          - scheduled_window
      lookback_days:
        description: "Calendar days considered by recent_window (1-14)."
        required: true
        default: "4"
        type: string
      download_multimedia:
        description: "Download dense external media after the script is approved. Turn off for a cheaper script/voice test."
        required: true
        default: true
        type: boolean
      promote_approved:
        description: "Promote an approved manual run into canonical scripts/ and multimedia/. Turn off for a safe experiment."
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ai-news-video-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-video-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project
        run: python -m pip install -c requirements.lock .

      - name: Validate deterministic contracts
        run: |
          python -m compileall app pipeline
          python -c "import app.agent, pipeline.run_hardened, pipeline.runtime_hardening, pipeline.source_coverage, pipeline.production_script; print('runtime imports ok')"
          python -m unittest discover -s tests -v

      - name: Resolve script date
        id: script_date
        env:
          MANUAL_TARGET_DATE: ${{ inputs.target_date }}
        run: |
          if [ -n "$MANUAL_TARGET_DATE" ]; then
            TARGET_DATE="$MANUAL_TARGET_DATE"
          else
            TARGET_DATE="$(TZ=America/Mexico_City date +%F)"
          fi
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "Script target date: $TARGET_DATE"

      - name: Resolve runtime options
        id: runtime_options
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SOURCE_MODE: ${{ inputs.source_mode }}
          MANUAL_LOOKBACK_DAYS: ${{ inputs.lookback_days }}
          MANUAL_DOWNLOAD_MULTIMEDIA: ${{ inputs.download_multimedia }}
          MANUAL_PROMOTE_APPROVED: ${{ inputs.promote_approved }}
          DEFAULT_DOWNLOAD_MULTIMEDIA: ${{ vars.DOWNLOAD_MULTIMEDIA || 'true' }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SOURCE_MODE="${MANUAL_SOURCE_MODE:-recent_window}"
            LOOKBACK_DAYS="${MANUAL_LOOKBACK_DAYS:-4}"
            DOWNLOAD_MULTIMEDIA="${MANUAL_DOWNLOAD_MULTIMEDIA:-true}"
            PROMOTE_APPROVED="${MANUAL_PROMOTE_APPROVED:-false}"
          else
            SOURCE_MODE="scheduled_window"
            LOOKBACK_DAYS="4"
            DOWNLOAD_MULTIMEDIA="${DEFAULT_DOWNLOAD_MULTIMEDIA:-true}"
            PROMOTE_APPROVED="true"
          fi

          echo "source_mode=$SOURCE_MODE" >> "$GITHUB_OUTPUT"
          echo "lookback_days=$LOOKBACK_DAYS" >> "$GITHUB_OUTPUT"
          echo "download_multimedia=$DOWNLOAD_MULTIMEDIA" >> "$GITHUB_OUTPUT"
          echo "promote_approved=$PROMOTE_APPROVED" >> "$GITHUB_OUTPUT"
          echo "Source mode: $SOURCE_MODE"
          echo "Lookback days: $LOOKBACK_DAYS"
          echo "Download multimedia: $DOWNLOAD_MULTIMEDIA"
          echo "Promote approved: $PROMOTE_APPROVED"

      - name: Prepare isolated run workspace
        id: workspace
        env:
          TARGET_DATE: ${{ steps.script_date.outputs.target_date }}
        run: |
          RUN_ROOT=".pipeline-runs/$TARGET_DATE/$GITHUB_RUN_ID"
          rm -rf "$RUN_ROOT"
          mkdir -p "$RUN_ROOT/scripts/$TARGET_DATE" "$RUN_ROOT/multimedia"
          echo "run_root=$RUN_ROOT" >> "$GITHUB_OUTPUT"
          echo "Isolated run workspace: $RUN_ROOT"

      - name: Validate source coverage before model calls
        id: source_coverage
        env:
          TARGET_DATE: ${{ steps.script_date.outputs.target_date }}
          RUN_ROOT: ${{ steps.workspace.outputs.run_root }}
          NEWS_SOURCE_MODE: ${{ steps.runtime_options.outputs.source_mode }}
          NEWS_LOOKBACK_DAYS: ${{ steps.runtime_options.outputs.lookback_days }}
          MIN_SOURCE_COVERAGE_RATIO: ${{ vars.MIN_SOURCE_COVERAGE_RATIO || '0.75' }}
        run: |
          set +e
          python -m pipeline.source_coverage \
            --target-date "$TARGET_DATE" \
            --news-dir news \
            --output "$RUN_ROOT/source_coverage.json" \
            --state-out "$RUN_ROOT/scripts/$TARGET_DATE/run_state.json"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "sufficient=true" >> "$GITHUB_OUTPUT"
          elif [ "$STATUS" -eq 2 ]; then
            echo "sufficient=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Source coverage below production threshold; skipping all model calls."
          else
            exit "$STATUS"
          fi

      - name: Check OpenAI secret
        id: secret_check
        if: steps.source_coverage.outputs.sufficient == 'true'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured in repository Actions secrets."
            exit 1
          fi

      - name: Build isolated episode
        id: build
        if: steps.source_coverage.outputs.sufficient == 'true' && steps.secret_check.outcome == 'success'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-nano' }}
          SCRIPT_QUALITY_THRESHOLD: ${{ vars.SCRIPT_QUALITY_THRESHOLD || '8.7' }}
          JUDGE_THRESHOLD: ${{ vars.JUDGE_THRESHOLD || '8.5' }}
          VOICE_THRESHOLD: ${{ vars.VOICE_THRESHOLD || '8.7' }}
          MAX_REFINEMENT_ITERATIONS: ${{ vars.MAX_REFINEMENT_ITERATIONS || '5' }}
          MAX_SELECTED_NEWS: "8"
          DOWNLOAD_MULTIMEDIA: "false"
          SELECTION_HISTORY_DAYS: ${{ vars.SELECTION_HISTORY_DAYS || '30' }}
          ESSAY_HISTORY_DAYS: ${{ vars.ESSAY_HISTORY_DAYS || '120' }}
          MAX_RECENT_ESSAYS: ${{ vars.MAX_RECENT_ESSAYS || '12' }}
          ESSAY_DUPLICATE_THRESHOLD: ${{ vars.ESSAY_DUPLICATE_THRESHOLD || '0.42' }}
          MAX_NOVELTY_REPLANS: ${{ vars.MAX_NOVELTY_REPLANS || '2' }}
          TARGET_MIN_SECONDS: ${{ vars.TARGET_MIN_SECONDS || '420' }}
          TARGET_MAX_SECONDS: ${{ vars.TARGET_MAX_SECONDS || '1200' }}
          WORDS_PER_SECOND: ${{ vars.WORDS_PER_SECOND || '2.5' }}
          AGENT_MAX_ATTEMPTS: ${{ vars.AGENT_MAX_ATTEMPTS || '3' }}
          AGENT_RETRY_BASE_SECONDS: ${{ vars.AGENT_RETRY_BASE_SECONDS || '2.0' }}
          NEWS_SOURCE_MODE: ${{ steps.runtime_options.outputs.source_mode }}
          NEWS_LOOKBACK_DAYS: ${{ steps.runtime_options.outputs.lookback_days }}
          RUN_ROOT: ${{ steps.workspace.outputs.run_root }}
        run: |
          python -m pipeline.run_hardened \
            --target-date "${{ steps.script_date.outputs.target_date }}" \
            --scripts-dir "$RUN_ROOT/scripts" \
            --multimedia-dir "$RUN_ROOT/multimedia" \
            --history-scripts-dir scripts \
            --editorial-dir editorial \
            --max-media-downloads 0 \
            --no-download-multimedia

      - name: Determine episode outcome
        id: episode_outcome
        if: always()
        env:
          TARGET_DATE: ${{ steps.script_date.outputs.target_date }}
          RUN_ROOT: ${{ steps.workspace.outputs.run_root }}
          COVERAGE_SUFFICIENT: ${{ steps.source_coverage.outputs.sufficient }}
          SECRET_OUTCOME: ${{ steps.secret_check.outcome }}
          BUILD_STEP_OUTCOME: ${{ steps.build.outcome }}
        run: |
          STATE_FILE="$RUN_ROOT/scripts/$TARGET_DATE/run_state.json"
          if [ "$COVERAGE_SUFFICIENT" = "false" ] && [ -f "$STATE_FILE" ]; then
            STATUS="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["status"])' "$STATE_FILE")"
          elif [ "$COVERAGE_SUFFICIENT" = "true" ] && [ "$SECRET_OUTCOME" != "success" ]; then
            STATUS="missing_openai_secret"
          elif [ -f "$STATE_FILE" ]; then
            STATUS="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["status"])' "$STATE_FILE")"
          elif [ "$BUILD_STEP_OUTCOME" = "failure" ]; then
            STATUS="failure"
          else
            STATUS="failure"
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Episode outcome: $STATUS"

      - name: Build canonical dense multimedia package
        id: dense_media
        if: steps.episode_outcome.outputs.status == 'approved' && steps.runtime_options.outputs.download_multimedia == 'true'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-nano' }}
          MEDIA_MIN_RELEVANCE_SCORE: ${{ vars.MEDIA_MIN_RELEVANCE_SCORE || '0.22' }}
          MEDIA_HTTP_MAX_ATTEMPTS: ${{ vars.MEDIA_HTTP_MAX_ATTEMPTS || '3' }}
          MEDIA_HTTP_RETRY_BASE_SECONDS: ${{ vars.MEDIA_HTTP_RETRY_BASE_SECONDS || '1.0' }}
          MAX_MEDIA: ${{ vars.MAX_MEDIA_DOWNLOADS || '54' }}
          TARGET_DATE: ${{ steps.script_date.outputs.target_date }}
          RUN_ROOT: ${{ steps.workspace.outputs.run_root }}
        run: |
          set -euo pipefail
          MAX_MEDIA="${MAX_MEDIA:-54}"
          OUTPUT_DIR="$RUN_ROOT/multimedia/$TARGET_DATE"
          ZIP="$RUN_ROOT/multimedia/multimedia-${TARGET_DATE}-run-${GITHUB_RUN_ID}.zip"
          rm -rf "$OUTPUT_DIR" "$ZIP"

          run_offline() {
            rm -rf "$OUTPUT_DIR" "$ZIP"
            python -m pipeline.review_media_offline_dense \
              --episode-dir "$RUN_ROOT/scripts/$TARGET_DATE" \
              --output-dir "$OUTPUT_DIR" \
              --zip-out "$ZIP" \
              --max-media-downloads "$MAX_MEDIA"
          }

          set +e
          python -m pipeline.review_media_dense_hardened \
            --episode-dir "$RUN_ROOT/scripts/$TARGET_DATE" \
            --output-dir "$OUTPUT_DIR" \
            --zip-out "$ZIP" \
            --max-media-downloads "$MAX_MEDIA" 2>&1 | tee /tmp/production-dense-media.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            if grep -Eqi 'credit_balance_exhausted|insufficient_quota|no credits remaining' /tmp/production-dense-media.log; then
              echo "::warning::Model quota unavailable; rebuilding canonical multimedia deterministically."
              run_offline
            else
              exit "$STATUS"
            fi
          fi

          export OUTPUT_DIR MAX_MEDIA
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads((Path(os.environ["OUTPUT_DIR"]) / "manifest.json").read_text(encoding="utf-8"))
          budget = int(os.environ.get("MAX_MEDIA", "54"))
          count = len(manifest)
          videos = sum(1 for item in manifest if item.get("asset_type") == "video")
          images = sum(1 for item in manifest if item.get("asset_type") == "image")
          opening = sum(1 for item in manifest if float(item.get("start_seconds", 0) or 0) < 20)
          print(f"Canonical dense media: {count} assets = {videos} video + {images} image; opening={opening}")
          if budget >= 45 and count < 45:
              raise SystemExit(f"Dense media floor failed: expected >=45 assets, got {count}")
          if opening < 5:
              raise SystemExit(f"Cold-open media floor failed: expected >=5 assets, got {opening}")
          PY

      - name: Discover real footage on YouTube
        id: footage
        if: always() && steps.episode_outcome.outputs.status == 'approved'
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_MAX_QUERIES_PER_NEWS: ${{ vars.YOUTUBE_MAX_QUERIES_PER_NEWS || '2' }}
          YOUTUBE_MAX_RESULTS_PER_QUERY: ${{ vars.YOUTUBE_MAX_RESULTS_PER_QUERY || '6' }}
          YOUTUBE_MAX_CANDIDATES_PER_NEWS: ${{ vars.YOUTUBE_MAX_CANDIDATES_PER_NEWS || '5' }}
          YOUTUBE_HTTP_MAX_ATTEMPTS: ${{ vars.YOUTUBE_HTTP_MAX_ATTEMPTS || '3' }}
          YOUTUBE_HTTP_RETRY_BASE_SECONDS: ${{ vars.YOUTUBE_HTTP_RETRY_BASE_SECONDS || '1.0' }}
          TARGET_DATE: ${{ steps.script_date.outputs.target_date }}
          RUN_ROOT: ${{ steps.workspace.outputs.run_root }}
        run: |
          mkdir -p "$RUN_ROOT/multimedia/$TARGET_DATE"
          python -m pipeline.footage \\
            --episode-dir "$RUN_ROOT/scripts/$TARGET_DATE" \\
            --output "$RUN_ROOT/multimedia/$TARGET_DATE/footage_candidates.json"

      - name: Create production script
        id: production_script
        if: always() && steps.episode_outcome.outputs.status == 'approved'
        continue-on-error: true
        env:
          TARGET_DATE: ${{ steps.script_date.outputs.target_date }}
          RUN_ROOT: ${{ steps.workspace.outputs.run_root }}
          WORDS_PER_SECOND: ${{ vars.WORDS_PER_SECOND || '2.5' }}
          PRODUCTION_CTA_TEXT: ${{ vars.PRODUCTION_CTA_TEXT }}
        run: |
          python -m pipeline.production_script \
            --target-date "$TARGET_DATE" \
            --scripts-dir "$RUN_ROOT/scripts" \
            --multimedia-dir "$RUN_ROOT/multimedia" \
            --words-per-second "$WORDS_PER_SECOND"

      - name: Create run report
        id: report
        if: always()
        env:
          EPISODE_RUN_ID: ${{ github.run_id }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-nano' }}
          SCRIPT_QUALITY_THRESHOLD: ${{ vars.SCRIPT_QUALITY_THRESHOLD || '8.7' }}
          JUDGE_THRESHOLD: ${{ vars.JUDGE_THRESHOLD || '8.5' }}
          VOICE_THRESHOLD: ${{ vars.VOICE_THRESHOLD || '8.7' }}
          MAX_REFINEMENT_ITERATIONS: ${{ vars.MAX_REFINEMENT_ITERATIONS || '5' }}
          MAX_SELECTED_NEWS: "8"
          MAX_MEDIA_DOWNLOADS: ${{ vars.MAX_MEDIA_DOWNLOADS || '54' }}
          DOWNLOAD_MULTIMEDIA: ${{ steps.runtime_options.outputs.download_multimedia }}
          SELECTION_HISTORY_DAYS: ${{ vars.SELECTION_HISTORY_DAYS || '30' }}
          ESSAY_HISTORY_DAYS: ${{ vars.ESSAY_HISTORY_DAYS || '120' }}
          MAX_RECENT_ESSAYS: ${{ vars.MAX_RECENT_ESSAYS || '12' }}
          ESSAY_DUPLICATE_THRESHOLD: ${{ vars.ESSAY_DUPLICATE_THRESHOLD || '0.42' }}
          MAX_NOVELTY_REPLANS: ${{ vars.MAX_NOVELTY_REPLANS || '2' }}
          TARGET_MIN_SECONDS: ${{ vars.TARGET_MIN_SECONDS || '420' }}
          TARGET_MAX_SECONDS: ${{ vars.TARGET_MAX_SECONDS || '1200' }}
          WORDS_PER_SECOND: ${{ vars.WORDS_PER_SECOND || '2.5' }}
          AGENT_MAX_ATTEMPTS: ${{ vars.AGENT_MAX_ATTEMPTS || '3' }}
          AGENT_RETRY_BASE_SECONDS: ${{ vars.AGENT_RETRY_BASE_SECONDS || '2.0' }}
          MEDIA_HTTP_MAX_ATTEMPTS: ${{ vars.MEDIA_HTTP_MAX_ATTEMPTS || '3' }}
          MEDIA_HTTP_RETRY_BASE_SECONDS: ${{ vars.MEDIA_HTTP_RETRY_BASE_SECONDS || '1.0' }}
          MEDIA_MIN_RELEVANCE_SCORE: ${{ vars.MEDIA_MIN_RELEVANCE_SCORE || '0.22' }}
          NEWS_SOURCE_MODE: ${{ steps.runtime_options.outputs.source_mode }}
          NEWS_LOOKBACK_DAYS: ${{ steps.runtime_options.outputs.lookback_days }}
          RUN_ROOT: ${{ steps.workspace.outputs.run_root }}
        run: |
          python -m pipeline.report \
            --target-date "${{ steps.script_date.outputs.target_date }}" \
            --build-outcome "${{ steps.episode_outcome.outputs.status }}" \
            --scripts-dir "$RUN_ROOT/scripts" \
            --multimedia-dir "$RUN_ROOT/multimedia" \
            --editorial-dir editorial

      - name: Refresh branch before promotion
        if: >-
          steps.episode_outcome.outputs.status == 'approved' &&
          steps.production_script.outcome == 'success' &&
          steps.report.outcome == 'success' &&
          (steps.runtime_options.outputs.download_multimedia != 'true' || steps.dense_media.outcome == 'success') &&
          steps.runtime_options.outputs.promote_approved == 'true'
        run: git pull --rebase origin "$GITHUB_REF_NAME"

      - name: Promote approved episode
        id: promote
        if: >-
          steps.episode_outcome.outputs.status == 'approved' &&
          steps.production_script.outcome == 'success' &&
          steps.report.outcome == 'success' &&
          (steps.runtime_options.outputs.download_multimedia != 'true' || steps.dense_media.outcome == 'success') &&
          steps.runtime_options.outputs.promote_approved == 'true'
        env:
          TARGET_DATE: ${{ steps.script_date.outputs.target_date }}
          RUN_ROOT: ${{ steps.workspace.outputs.run_root }}
        run: |
          rm -rf "scripts/$TARGET_DATE" "multimedia/$TARGET_DATE"
          cp -R "$RUN_ROOT/scripts/$TARGET_DATE" "scripts/$TARGET_DATE"
          if [ -d "$RUN_ROOT/multimedia/$TARGET_DATE" ]; then
            cp -R "$RUN_ROOT/multimedia/$TARGET_DATE" "multimedia/$TARGET_DATE"
            # YouTube API metadata is intentionally ephemeral. The isolated run artifact
            # retains it for 30 days, but canonical history must not persist it indefinitely.
            rm -f "multimedia/$TARGET_DATE/footage_candidates.json"
          fi
          echo "promoted=true" >> "$GITHUB_OUTPUT"

      - name: Commit approved canonical artifacts
        if: steps.promote.outputs.promoted == 'true'
        env:
          TARGET_DATE: ${{ steps.script_date.outputs.target_date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "scripts/$TARGET_DATE" "multimedia/$TARGET_DATE"
          if git diff --cached --quiet; then
            echo "No canonical episode changes to commit."
            exit 0
          fi
          git commit -m "content: publish approved AI news kit for $TARGET_DATE"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload isolated run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-run-${{ steps.script_date.outputs.target_date }}-${{ github.run_id }}
          path: ${{ steps.workspace.outputs.run_root }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Propagate non-publishable outcome
        if: >-
          steps.episode_outcome.outputs.status == 'missing_openai_secret' ||
          steps.episode_outcome.outputs.status == 'failure' ||
          steps.episode_outcome.outputs.status == 'script_not_approved' ||
          steps.dense_media.outcome == 'failure' ||
          steps.production_script.outcome == 'failure' ||
          steps.report.outcome == 'failure'
        run: |
          echo "Episode outcome: ${{ steps.episode_outcome.outputs.status }}"
          echo "Run artifacts were preserved; nothing non-approved was promoted."
          exit 1
