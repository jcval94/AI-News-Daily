name: Ingest AI News Staging

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: ai-news-ingestion-main
  cancel-in-progress: false

jobs:
  ingest:
    if: github.event.issue.state == 'open' && startsWith(github.event.issue.title, 'AI_NEWS_STAGING — ')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify staging author
        env:
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "$ISSUE_AUTHOR" != "$REPO_OWNER" ]; then
            echo "Ignoring staging issue from $ISSUE_AUTHOR; expected repository owner $REPO_OWNER."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install validator dependency
        run: python -m pip install -c requirements.lock pydantic

      - name: Validate staging issue and materialize digest
        id: ingest
        run: python -m pipeline.staged_news_issue

      - name: Recheck main and commit exactly one digest
        id: publish
        if: steps.ingest.outputs.status == 'created'
        env:
          DIGEST_PATH: ${{ steps.ingest.outputs.path }}
          DIGEST_DATE: ${{ steps.ingest.outputs.date }}
        run: |
          set -euo pipefail
          git fetch origin main

          REMOTE_NEWS="$(mktemp -d)"
          git archive origin/main news/ | tar -x -C "$REMOTE_NEWS"
          if python -m pipeline.news_ingestion_health --date "$DIGEST_DATE" --news-dir "$REMOTE_NEWS/news" --output "$REMOTE_NEWS/health.json"; then
            echo "A healthy digest for ${DIGEST_DATE} already exists on origin/main; refusing duplicate publication."
            rm -f -- "$DIGEST_PATH"
            rm -rf -- "$REMOTE_NEWS"
            git rebase origin/main
            echo "status=race_existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -rf -- "$REMOTE_NEWS"

          git rebase origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$DIGEST_PATH"

          mapfile -t STAGED < <(git diff --cached --name-only)
          if [ "${#STAGED[@]}" -ne 1 ] || [ "${STAGED[0]}" != "$DIGEST_PATH" ]; then
            printf 'Refusing commit; staged files were:\n%s\n' "${STAGED[*]}"
            exit 1
          fi

          git commit -m "Add AI news digest for ${DIGEST_DATE}"
          git push origin HEAD:main
          echo "status=published" >> "$GITHUB_OUTPUT"

      - name: Refresh ingestion health and production readiness
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST_DATE: ${{ steps.ingest.outputs.date }}
        run: python -m pipeline.news_ingestion_followup --date "$DIGEST_DATE" --repo "$GITHUB_REPOSITORY"

      - name: Comment and close successful staging issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          INGEST_STATUS: ${{ steps.ingest.outputs.status }}
          INGEST_PATH: ${{ steps.ingest.outputs.path }}
          PUBLISH_STATUS: ${{ steps.publish.outputs.status }}
        run: |
          set -euo pipefail
          if [ "$INGEST_STATUS" = "already_exists" ]; then
            MSG="No se publicó nada: ya existía un digest válido para hoy en \`$INGEST_PATH\`."
          elif [ "$PUBLISH_STATUS" = "race_existing" ]; then
            MSG="No se publicó nada: apareció otro digest del día antes del commit."
          else
            MSG="Digest validado y publicado en \`$INGEST_PATH\` sin usar una API de modelos desde GitHub Actions."
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$MSG"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Leave diagnostic comment on validation/publication failure
        if: failure() && github.event.issue.user.login == github.repository_owner
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "El staging no se publicó porque falló una validación o el commit. El issue queda abierto para diagnóstico y reintento sin regenerar el digest."
