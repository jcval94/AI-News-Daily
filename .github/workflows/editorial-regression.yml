name: Editorial Regression

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Frozen news window date"
        required: true
        default: "2026-08-21"
        type: string
      lookback_days:
        description: "Recent-window lookback"
        required: true
        default: "4"
        type: string
      run_live_model:
        description: "Run paid model calls. Keep false for offline cost replay only."
        required: true
        default: false
        type: boolean
      context_mode:
        description: "Live experimental arm. off = control; conservative = optimized."
        required: true
        default: conservative
        type: choice
        options:
          - off
          - conservative
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/editorial-regression.yml"
      - "pipeline/run_cost_optimized.py"
      - "pipeline/cost_context_replay.py"
      - "tests/test_cost_context.py"
  push:
    branches:
      - fix/high-1-4-editorial-stabilization
    paths:
      - ".github/workflows/editorial-regression.yml"

permissions:
  contents: read
  actions: read

jobs:
  current-runtime-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c requirements.lock .

      - name: Resolve scenario
        id: scenario
        env:
          INPUT_DATE: ${{ inputs.target_date }}
          INPUT_LOOKBACK: ${{ inputs.lookback_days }}
        run: |
          echo "target_date=${INPUT_DATE:-2026-08-21}" >> "$GITHUB_OUTPUT"
          echo "lookback_days=${INPUT_LOOKBACK:-4}" >> "$GITHUB_OUTPUT"
          echo "run_root=.editorial-regression/$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Replay historical context reduction without model calls
        id: replay
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_DATE: ${{ steps.scenario.outputs.target_date }}
          RUN_ROOT: ${{ steps.scenario.outputs.run_root }}
          NEWS_SOURCE_MODE: recent_window
          NEWS_LOOKBACK_DAYS: ${{ steps.scenario.outputs.lookback_days }}
        run: |
          set -euo pipefail
          test "$TARGET_DATE" = "2026-08-21" || {
            echo "Offline replay is pinned to audited target 2026-08-21; got $TARGET_DATE";
            exit 1;
          }
          rm -rf .cost-baseline
          mkdir -p .cost-baseline "$RUN_ROOT"
          gh run download 32541706631 \
            --name editorial-regression-2026-08-21-32541706631 \
            --dir .cost-baseline
          python -m pipeline.cost_context_replay \
            --episode-dir ".cost-baseline/scripts/$TARGET_DATE" \
            --news-dir news \
            --target-date "$TARGET_DATE" \
            --output "$RUN_ROOT/cost-replay.json"

      - name: Require model secret for explicit live test
        if: github.event_name == 'workflow_dispatch' && inputs.run_live_model == true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is required for a live test"; exit 1; }

      - name: Run explicitly requested live experimental arm
        id: build
        if: github.event_name == 'workflow_dispatch' && inputs.run_live_model == true
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-nano' }}
          COST_CONTEXT_MODE: ${{ inputs.context_mode }}
          SCRIPT_QUALITY_THRESHOLD: ${{ vars.SCRIPT_QUALITY_THRESHOLD || '8.7' }}
          JUDGE_THRESHOLD: ${{ vars.JUDGE_THRESHOLD || '8.5' }}
          VOICE_THRESHOLD: ${{ vars.VOICE_THRESHOLD || '8.7' }}
          MAX_REFINEMENT_ITERATIONS: ${{ vars.MAX_REFINEMENT_ITERATIONS || '5' }}
          MAX_SELECTED_NEWS: ${{ vars.MAX_SELECTED_NEWS || '8' }}
          SELECTION_HISTORY_DAYS: ${{ vars.SELECTION_HISTORY_DAYS || '30' }}
          ESSAY_HISTORY_DAYS: ${{ vars.ESSAY_HISTORY_DAYS || '120' }}
          MAX_RECENT_ESSAYS: ${{ vars.MAX_RECENT_ESSAYS || '12' }}
          ESSAY_DUPLICATE_THRESHOLD: ${{ vars.ESSAY_DUPLICATE_THRESHOLD || '0.42' }}
          MAX_NOVELTY_REPLANS: ${{ vars.MAX_NOVELTY_REPLANS || '2' }}
          TARGET_MIN_SECONDS: ${{ vars.TARGET_MIN_SECONDS || '420' }}
          TARGET_MAX_SECONDS: ${{ vars.TARGET_MAX_SECONDS || '1200' }}
          WORDS_PER_SECOND: ${{ vars.WORDS_PER_SECOND || '2.5' }}
          AGENT_MAX_ATTEMPTS: ${{ vars.AGENT_MAX_ATTEMPTS || '3' }}
          AGENT_RETRY_BASE_SECONDS: ${{ vars.AGENT_RETRY_BASE_SECONDS || '2.0' }}
          NEWS_SOURCE_MODE: recent_window
          NEWS_LOOKBACK_DAYS: ${{ steps.scenario.outputs.lookback_days }}
          DOWNLOAD_MULTIMEDIA: "false"
          TARGET_DATE: ${{ steps.scenario.outputs.target_date }}
          RUN_ROOT: ${{ steps.scenario.outputs.run_root }}
        run: |
          mkdir -p "$RUN_ROOT/scripts" "$RUN_ROOT/multimedia"
          python -m pipeline.run_cost_optimized \
            --target-date "$TARGET_DATE" \
            --scripts-dir "$RUN_ROOT/scripts" \
            --multimedia-dir "$RUN_ROOT/multimedia" \
            --history-scripts-dir scripts \
            --editorial-dir editorial \
            --max-media-downloads 0 \
            --no-download-multimedia

      - name: Print live token and context telemetry
        if: always() && github.event_name == 'workflow_dispatch' && inputs.run_live_model == true
        env:
          TARGET_DATE: ${{ steps.scenario.outputs.target_date }}
          RUN_ROOT: ${{ steps.scenario.outputs.run_root }}
        run: |
          python - <<'PY'
          import json
          import os
          from collections import defaultdict
          from pathlib import Path

          path = Path(os.environ["RUN_ROOT"]) / "scripts" / os.environ["TARGET_DATE"] / "execution_trace.json"
          if not path.exists():
              print("No execution_trace.json available")
              raise SystemExit(0)
          trace = json.loads(path.read_text(encoding="utf-8"))
          by_step = defaultdict(lambda: {"prompt": 0, "cached": 0, "output": 0, "total": 0, "calls": 0})
          for call in trace.get("agent_calls", []):
              if not isinstance(call, dict) or call.get("status") != "success":
                  continue
              usage = call.get("usage", {}) if isinstance(call.get("usage"), dict) else {}
              row = by_step[str(call.get("step", "unknown"))]
              row["calls"] += 1
              row["prompt"] += int(usage.get("prompt_tokens", 0) or 0)
              row["cached"] += int(usage.get("cached_prompt_tokens", 0) or 0)
              row["output"] += int(usage.get("output_tokens", 0) or 0)
              row["total"] += int(usage.get("total_tokens", 0) or 0)
              compact = call.get("context_compaction")
              if compact:
                  print(
                      f"COMPACTION {call.get('step')} iter={call.get('iteration')}: "
                      f"{compact.get('context_chars_before')} -> {compact.get('context_chars_after')} chars "
                      f"({compact.get('context_char_reduction_pct')}%; mode={compact.get('mode')}; "
                      f"raw_sources={compact.get('raw_source_item_count')})"
                  )
          print("TOKEN SUMMARY")
          for step, row in sorted(by_step.items(), key=lambda pair: -pair[1]["total"]):
              print(step, row)
          print("TOTAL", {key: sum(row[key] for row in by_step.values()) for key in ("prompt", "cached", "output", "total")})
          PY

      - name: Evaluate live editorial structure
        id: regression
        if: always() && github.event_name == 'workflow_dispatch' && inputs.run_live_model == true
        continue-on-error: true
        env:
          TARGET_DATE: ${{ steps.scenario.outputs.target_date }}
          RUN_ROOT: ${{ steps.scenario.outputs.run_root }}
        run: |
          python -m pipeline.editorial_regression \
            --episode-dir "$RUN_ROOT/scripts/$TARGET_DATE" \
            --output "$RUN_ROOT/editorial-regression.json"

      - name: Print reviewable experiment artifacts
        if: always()
        env:
          TARGET_DATE: ${{ steps.scenario.outputs.target_date }}
          RUN_ROOT: ${{ steps.scenario.outputs.run_root }}
        run: |
          if [ -f "$RUN_ROOT/cost-replay.json" ]; then
            echo "===== cost-replay.json ====="
            cat "$RUN_ROOT/cost-replay.json"
            echo
          fi
          for file in episode_plan.json script_sections.json reviews.json run_state.json script.txt; do
            path="$RUN_ROOT/scripts/$TARGET_DATE/$file"
            if [ -f "$path" ]; then
              echo "===== $file ====="
              cat "$path"
              echo
            fi
          done
          if [ -f "$RUN_ROOT/editorial-regression.json" ]; then
            echo "===== editorial-regression.json ====="
            cat "$RUN_ROOT/editorial-regression.json"
          fi

      - name: Upload offline cost replay artifact
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.run_live_model == true)
        uses: actions/upload-artifact@v4
        with:
          name: cost-replay-${{ steps.scenario.outputs.target_date }}-${{ github.run_id }}
          path: ${{ steps.scenario.outputs.run_root }}/cost-replay.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload explicit live regression artifact
        if: always() && github.event_name == 'workflow_dispatch' && inputs.run_live_model == true
        uses: actions/upload-artifact@v4
        with:
          name: editorial-regression-${{ steps.scenario.outputs.target_date }}-${{ github.run_id }}
          path: ${{ steps.scenario.outputs.run_root }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Validate experiment outcome
        if: always()
        env:
          LIVE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_model == true }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          RUN_ROOT: ${{ steps.scenario.outputs.run_root }}
        run: |
          test -f "$RUN_ROOT/cost-replay.json" || {
            echo "Offline cost replay did not complete";
            exit 1;
          }
          if [ "$LIVE_REQUESTED" = "true" ]; then
            echo "Live build outcome: $BUILD_OUTCOME"
            echo "Live regression outcome: $REGRESSION_OUTCOME"
            test "$BUILD_OUTCOME" = "success" || exit 1
            test "$REGRESSION_OUTCOME" = "success" || exit 1
          else
            echo "Offline replay passed; no paid model calls were requested."
          fi
