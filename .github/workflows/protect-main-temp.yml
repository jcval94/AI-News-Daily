name: Temporary Protect Main

on:
  push:
    branches:
      - fix/high-3-9-production-hardening
    paths:
      - .github/workflows/protect-main-temp.yml

permissions:
  contents: read

jobs:
  protect-main:
    runs-on: ubuntu-latest
    steps:
      - name: Require PR and deterministic CI on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          url = f"https://api.github.com/repos/{os.environ['REPO']}/branches/main/protection"
          payload = json.dumps({
              "required_status_checks": {"strict": True, "contexts": ["deterministic-tests"]},
              "enforce_admins": False,
              "required_pull_request_reviews": {
                  "dismiss_stale_reviews": False,
                  "require_code_owner_reviews": False,
                  "required_approving_review_count": 0
              },
              "restrictions": None,
              "allow_force_pushes": False,
              "allow_deletions": False
          }).encode()
          req = urllib.request.Request(url, data=payload, method="PUT", headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          })
          try:
              with urllib.request.urlopen(req) as response:
                  print(response.status, response.read().decode())
          except urllib.error.HTTPError as exc:
              print(f"HTTP {exc.code}: {exc.read().decode()}")
              raise SystemExit(1)
          PY
