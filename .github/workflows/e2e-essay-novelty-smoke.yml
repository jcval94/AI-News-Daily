name: E2E Essay Novelty Smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  e2e-essay-novelty:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project
        run: python -m pip install .

      - name: Validate deterministic contracts
        run: |
          python -m compileall app pipeline
          python -c "import app.agent, pipeline.run; print('runtime imports ok')"
          python -m unittest discover -s tests -v

      - name: Check required secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured."
            exit 1
          fi

      - name: Prepare isolated workspace
        run: |
          mkdir -p .pipeline-runs/2026-08-21/${GITHUB_RUN_ID}/scripts
          mkdir -p .pipeline-runs/2026-08-21/${GITHUB_RUN_ID}/multimedia

      - name: Run current essay-first pipeline with novelty guard
        id: build
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-nano' }}
          SCRIPT_QUALITY_THRESHOLD: ${{ vars.SCRIPT_QUALITY_THRESHOLD || '8.7' }}
          JUDGE_THRESHOLD: ${{ vars.JUDGE_THRESHOLD || '8.5' }}
          VOICE_THRESHOLD: ${{ vars.VOICE_THRESHOLD || '8.7' }}
          MAX_REFINEMENT_ITERATIONS: ${{ vars.MAX_REFINEMENT_ITERATIONS || '5' }}
          MAX_SELECTED_NEWS: "8"
          MAX_MEDIA_DOWNLOADS: "0"
          DOWNLOAD_MULTIMEDIA: "false"
          SELECTION_HISTORY_DAYS: ${{ vars.SELECTION_HISTORY_DAYS || '30' }}
          ESSAY_HISTORY_DAYS: ${{ vars.ESSAY_HISTORY_DAYS || '120' }}
          MAX_RECENT_ESSAYS: ${{ vars.MAX_RECENT_ESSAYS || '12' }}
          ESSAY_DUPLICATE_THRESHOLD: ${{ vars.ESSAY_DUPLICATE_THRESHOLD || '0.42' }}
          MAX_NOVELTY_REPLANS: ${{ vars.MAX_NOVELTY_REPLANS || '2' }}
          TARGET_MIN_SECONDS: ${{ vars.TARGET_MIN_SECONDS || '420' }}
          TARGET_MAX_SECONDS: ${{ vars.TARGET_MAX_SECONDS || '1200' }}
          WORDS_PER_SECOND: ${{ vars.WORDS_PER_SECOND || '2.5' }}
          AGENT_MAX_ATTEMPTS: ${{ vars.AGENT_MAX_ATTEMPTS || '3' }}
          AGENT_RETRY_BASE_SECONDS: ${{ vars.AGENT_RETRY_BASE_SECONDS || '2.0' }}
          NEWS_SOURCE_MODE: recent_window
          NEWS_LOOKBACK_DAYS: "4"
          RUN_ROOT: .pipeline-runs/2026-08-21/${{ github.run_id }}
        run: |
          python -m pipeline.run \
            --target-date 2026-08-21 \
            --scripts-dir "$RUN_ROOT/scripts" \
            --multimedia-dir "$RUN_ROOT/multimedia" \
            --history-scripts-dir scripts \
            --editorial-dir editorial \
            --max-media-downloads 0 \
            --no-download-multimedia

      - name: Determine outcome
        id: outcome
        if: always()
        env:
          RUN_ROOT: .pipeline-runs/2026-08-21/${{ github.run_id }}
        run: |
          STATE_FILE="$RUN_ROOT/scripts/2026-08-21/run_state.json"
          if [ -f "$STATE_FILE" ]; then
            STATUS="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["status"])' "$STATE_FILE")"
          else
            STATUS="failure"
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Episode outcome: $STATUS"

      - name: Create run report
        if: always()
        env:
          EPISODE_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-nano' }}
          SCRIPT_QUALITY_THRESHOLD: ${{ vars.SCRIPT_QUALITY_THRESHOLD || '8.7' }}
          JUDGE_THRESHOLD: ${{ vars.JUDGE_THRESHOLD || '8.5' }}
          VOICE_THRESHOLD: ${{ vars.VOICE_THRESHOLD || '8.7' }}
          MAX_REFINEMENT_ITERATIONS: ${{ vars.MAX_REFINEMENT_ITERATIONS || '5' }}
          MAX_SELECTED_NEWS: "8"
          MAX_MEDIA_DOWNLOADS: "0"
          DOWNLOAD_MULTIMEDIA: "false"
          SELECTION_HISTORY_DAYS: ${{ vars.SELECTION_HISTORY_DAYS || '30' }}
          ESSAY_HISTORY_DAYS: ${{ vars.ESSAY_HISTORY_DAYS || '120' }}
          MAX_RECENT_ESSAYS: ${{ vars.MAX_RECENT_ESSAYS || '12' }}
          ESSAY_DUPLICATE_THRESHOLD: ${{ vars.ESSAY_DUPLICATE_THRESHOLD || '0.42' }}
          MAX_NOVELTY_REPLANS: ${{ vars.MAX_NOVELTY_REPLANS || '2' }}
          TARGET_MIN_SECONDS: ${{ vars.TARGET_MIN_SECONDS || '420' }}
          TARGET_MAX_SECONDS: ${{ vars.TARGET_MAX_SECONDS || '1200' }}
          WORDS_PER_SECOND: ${{ vars.WORDS_PER_SECOND || '2.5' }}
          AGENT_MAX_ATTEMPTS: ${{ vars.AGENT_MAX_ATTEMPTS || '3' }}
          AGENT_RETRY_BASE_SECONDS: ${{ vars.AGENT_RETRY_BASE_SECONDS || '2.0' }}
          NEWS_SOURCE_MODE: recent_window
          NEWS_LOOKBACK_DAYS: "4"
          RUN_ROOT: .pipeline-runs/2026-08-21/${{ github.run_id }}
        run: |
          python -m pipeline.report \
            --target-date 2026-08-21 \
            --build-outcome "${{ steps.outcome.outputs.status }}" \
            --scripts-dir "$RUN_ROOT/scripts" \
            --multimedia-dir "$RUN_ROOT/multimedia" \
            --editorial-dir editorial

      - name: Upload complete editorial artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-essay-novelty-2026-08-21-${{ github.run_id }}
          path: .pipeline-runs/2026-08-21/${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 30

      - name: Report non-approved outcome
        if: always() && steps.outcome.outputs.status != 'approved'
        run: |
          echo "Editorial E2E finished with status: ${{ steps.outcome.outputs.status }}"
          exit 1
