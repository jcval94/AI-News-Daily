name: Recover Editorial Grid Results

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/recover-editorial-grid-results.yml"

permissions:
  contents: write
  actions: read

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        shell: bash
        run: git pull --rebase origin main

      - name: Download final 20x3 artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36073833346
          pattern: editorial-grid-*
          path: /tmp/editorial-grid
          merge-multiple: true

      - name: Recover scripts and build compact indexes
        shell: bash
        run: |
          set -euo pipefail
          RESULTS="experiments/editorial_grid_search/results"
          rm -rf "$RESULTS/raw" "$RESULTS/scripts"
          mkdir -p "$RESULTS/raw" "$RESULTS/scripts"
          cp -R /tmp/editorial-grid/raw/. "$RESULTS/raw/"
          cp -R /tmp/editorial-grid/scripts/. "$RESULTS/scripts/"

          python - <<'PY'
          from __future__ import annotations
          import csv
          import json
          from pathlib import Path

          results = Path("experiments/editorial_grid_search/results")
          raw_paths = sorted((results / "raw").glob("*/*.json"))
          script_paths = sorted((results / "scripts").glob("*/*.txt"))

          if len(raw_paths) != 60:
              raise SystemExit(f"Expected 60 raw cells, found {len(raw_paths)}")
          if len(script_paths) != 60:
              raise SystemExit(f"Expected 60 scripts, found {len(script_paths)}")

          def balanced(ev):
              score = (
                  0.30 * float(ev["editorial_score"])
                  + 0.30 * float(ev["voice_score"])
                  + 0.25 * float(ev["attention_score"])
                  + 0.15 * float(ev["seo_score"])
              )
              factual = {"low": 0.0, "medium": 0.35, "high": 1.0}.get(
                  str(ev.get("factuality_risk", "")).lower(), 1.0
              )
              smell = {"low": 0.0, "medium": 0.35, "high": 0.8}.get(
                  str(ev.get("ai_smell_risk", "")).lower(), 0.8
              )
              return round(max(0.0, min(10.0, score - factual - smell)), 4)

          rows = []
          score_rows = []
          artifact_ids = {
              "g00_current_like": 10839108629,
              "g01_fit_scene_5b": 10839346464,
              "g02_fit_tension_4b": 10839316476,
              "g03_after_scene_5b": 10839148637,
              "g04_turn_paradox_5b": 10839341492,
              "g05_callback_tension_4b": 10839591045,
              "g06_forced_short_4b": 10838954271,
              "g07_forced_scene_fast": 10839601082,
              "g08_fit_dense_6b": 10839795534,
              "g09_fit_minimal_4b": 10839391697,
              "g10_after_dense_6b": 10838999390,
              "g11_turn_scene_4b": 10839585700,
              "g12_callback_scene_5b": 10839396636,
              "g13_fit_spoken_5b": 10839481544,
              "g14_fit_discovery_4b": 10839495789,
              "g15_fit_no_counter": 10839350964,
              "g16_fit_more_evidence": 10839941203,
              "g17_fit_early_thesis": 10839901320,
              "g18_after_paradox_4b": 10839144055,
              "g19_turn_minimal_5b": 10839875647,
          }

          for path in raw_paths:
              payload = json.loads(path.read_text(encoding="utf-8"))
              if payload.get("status") != "ok":
                  raise SystemExit(f"Non-ok raw result: {path}")
              cfg = str(payload["config"]["id"])
              fold = str(payload["fold"]["id"])
              ev = payload["evaluation"]
              script_rel = Path("experiments/editorial_grid_search/results/scripts") / cfg / f"{fold}.txt"
              if not script_rel.exists():
                  raise SystemExit(f"Missing script for {cfg}/{fold}")
              score = balanced(ev)
              compact = {
                  "config_id": cfg,
                  "fold_id": fold,
                  "fold_date": payload["fold"].get("date"),
                  "balanced_score": score,
                  "editorial_score": ev["editorial_score"],
                  "attention_score": ev["attention_score"],
                  "voice_score": ev["voice_score"],
                  "seo_score": ev["seo_score"],
                  "factuality_risk": ev["factuality_risk"],
                  "ai_smell_risk": ev["ai_smell_risk"],
                  "opening_fit": ev["opening_fit"],
                  "first_evidence_effectiveness": ev["first_evidence_effectiveness"],
                  "narrative_motion": ev["narrative_motion"],
                  "thesis_evolution": ev["thesis_evolution"],
                  "evidence_density": ev["evidence_density"],
                  "script_word_count": payload["script_word_count"],
                  "length_compliant": bool(payload.get("length_compliant", False)),
                  "selected_memory_id": payload.get("selected_memory_id"),
              }
              score_rows.append(compact)
              rows.append({
                  "config_id": cfg,
                  "fold_id": fold,
                  "fold_date": payload["fold"].get("date", ""),
                  "script_path": script_rel.as_posix(),
                  "raw_path": path.as_posix(),
                  "artifact_id": artifact_ids.get(cfg, ""),
                  "script_word_count": payload["script_word_count"],
                  "length_compliant": bool(payload.get("length_compliant", False)),
                  "balanced_score": score,
                  "editorial_score": ev["editorial_score"],
                  "attention_score": ev["attention_score"],
                  "voice_score": ev["voice_score"],
                  "seo_score": ev["seo_score"],
                  "factuality_risk": ev["factuality_risk"],
                  "ai_smell_risk": ev["ai_smell_risk"],
              })

          (results / "scores.jsonl").write_text(
              "".join(json.dumps(row, ensure_ascii=False) + "\n" for row in score_rows),
              encoding="utf-8",
          )
          with (results / "scripts_index.csv").open("w", encoding="utf-8", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=list(rows[0].keys()))
              writer.writeheader()
              writer.writerows(rows)

          manifest_path = results / "run_manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest.update({
              "schema_version": max(int(manifest.get("schema_version", 1)), 2),
              "raw_cells": len(raw_paths),
              "script_files": len(script_paths),
              "scores_rows": len(score_rows),
              "scripts_index_rows": len(rows),
              "artifact_recovery_source_run_id": 36073833346,
              "complete": len(raw_paths) == 60 and len(script_paths) == 60,
          })
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "raw": len(raw_paths),
              "scripts": len(script_paths),
              "scores": len(score_rows),
              "index": len(rows),
          }))
          PY

      - name: Commit recovered result set
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/editorial_grid_search/results
          if git diff --cached --quiet; then
            echo "Nothing to recover."
            exit 0
          fi
          git commit -m "experiment: complete 20x3 script archive"
          git push origin HEAD:main
