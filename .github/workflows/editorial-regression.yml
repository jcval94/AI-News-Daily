name: Editorial Regression

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Frozen news window date"
        required: true
        default: "2026-08-21"
        type: string
      lookback_days:
        description: "Recent-window lookback"
        required: true
        default: "4"
        type: string
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/editorial-regression.yml"
      - "pipeline/run_cost_optimized.py"
      - "tests/test_cost_context.py"
  push:
    branches:
      - fix/high-1-4-editorial-stabilization
    paths:
      - ".github/workflows/editorial-regression.yml"

permissions:
  contents: read
  actions: read

jobs:
  current-runtime-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c requirements.lock .

      - name: Resolve scenario
        id: scenario
        env:
          INPUT_DATE: ${{ inputs.target_date }}
          INPUT_LOOKBACK: ${{ inputs.lookback_days }}
        run: |
          echo "target_date=${INPUT_DATE:-2026-08-21}" >> "$GITHUB_OUTPUT"
          echo "lookback_days=${INPUT_LOOKBACK:-4}" >> "$GITHUB_OUTPUT"
          echo "run_root=.editorial-regression/$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Replay historical context reduction without model calls
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_DATE: ${{ steps.scenario.outputs.target_date }}
          RUN_ROOT: ${{ steps.scenario.outputs.run_root }}
          NEWS_SOURCE_MODE: recent_window
          NEWS_LOOKBACK_DAYS: ${{ steps.scenario.outputs.lookback_days }}
        run: |
          set -euo pipefail
          rm -rf .cost-baseline
          mkdir -p .cost-baseline "$RUN_ROOT"
          gh run download 32541706631 \
            --name editorial-regression-2026-08-21-32541706631 \
            --dir .cost-baseline

          python - <<'PY'
          import json
          import os
          from collections import Counter
          from datetime import date
          from pathlib import Path
          from types import SimpleNamespace

          import tiktoken

          from pipeline.evidence_reconciliation import reconcile_evidence_indices
          from pipeline.run import collect_available_news
          from pipeline.run_cost_optimized import compact_agent_state

          target = date.fromisoformat(os.environ["TARGET_DATE"])
          episode_dir = Path(".cost-baseline") / "scripts" / target.isoformat()
          selection = json.loads((episode_dir / "selected_news.json").read_text(encoding="utf-8"))
          plan = json.loads((episode_dir / "episode_plan.json").read_text(encoding="utf-8"))
          historical_trace = json.loads((episode_dir / "execution_trace.json").read_text(encoding="utf-8"))

          news_text, available_files, missing_dates, source_items = collect_available_news(Path("news"), target)
          selected_json = json.dumps(selection, ensure_ascii=False)
          plan_json = json.dumps(plan, ensure_ascii=False)
          state = {
              "selected_news": selected_json,
              "news_text": news_text,
              "episode_plan": plan_json,
              "draft_script": (episode_dir / "script.txt").read_text(encoding="utf-8"),
          }

          reconciled, changes = reconcile_evidence_indices(plan, selection)
          reconciled_indices = {
              item["evidence_id"]: item["selected_news_index"]
              for item in reconciled.get("evidence", [])
          }
          declared_indices = {
              item["evidence_id"]: item["selected_news_index"]
              for item in plan.get("evidence", [])
          }

          # Verify that every reconciled evidence item still points to the exact factual source
          # parsed from the frozen news files, not a summary reconstructed by the experiment.
          source_by_id = {item.news_id: item.model_dump() for item in source_items}
          evidence_integrity = []
          for evidence in reconciled.get("evidence", []):
              index = int(evidence["selected_news_index"])
              selected_item = selection["items"][index - 1]
              source_item = source_by_id.get(selected_item.get("news_id"), {})
              raw_match = bool(source_item) and source_item.get("raw_content") == selected_item.get("raw_content")
              locator_match = bool(source_item) and source_item.get("source_locator") == selected_item.get("source_locator")
              url_match = bool(source_item) and source_item.get("url") == selected_item.get("url")
              evidence_integrity.append(
                  {
                      "evidence_id": evidence["evidence_id"],
                      "selected_news_index": index,
                      "news_id": selected_item.get("news_id"),
                      "raw_content_exact_match": raw_match,
                      "source_locator_exact_match": locator_match,
                      "url_exact_match": url_match,
                  }
              )
          if not evidence_integrity or not all(
              row["raw_content_exact_match"]
              and row["source_locator_exact_match"]
              and row["url_exact_match"]
              for row in evidence_integrity
          ):
              raise SystemExit("Evidence integrity check failed; refusing to report savings")

          enc = tiktoken.get_encoding("o200k_base")
          tok = lambda text: len(enc.encode(str(text or "")))
          selected_full_tokens = tok(state["selected_news"])
          news_full_tokens = tok(state["news_text"])
          source_full_tokens = selected_full_tokens + news_full_tokens

          successful_steps = Counter(
              call.get("step")
              for call in historical_trace.get("agent_calls", [])
              if isinstance(call, dict) and call.get("status") == "success"
          )
          baseline_prompt_tokens = sum(
              int((call.get("usage") or {}).get("prompt_tokens", 0) or 0)
              for call in historical_trace.get("agent_calls", [])
              if isinstance(call, dict) and call.get("status") == "success"
          )
          factual_calls = (
              successful_steps["write_script"]
              + successful_steps["editorial_judge"]
              + successful_steps["refine_script"]
          )
          seo_calls = successful_steps["seo_judge"]

          variants = {}
          for mode in ("conservative", "strict"):
              factual_state, factual_stats = compact_agent_state(
                  SimpleNamespace(name="script_critic"), state, mode=mode
              )
              seo_state, seo_stats = compact_agent_state(
                  SimpleNamespace(name="seo_master"), state, mode=mode
              )
              if factual_stats is None or seo_stats is None:
                  raise SystemExit(f"{mode} compaction unexpectedly failed open")

              factual_source_tokens = tok(factual_state["selected_news"]) + tok(factual_state["news_text"])
              seo_selected_tokens = tok(seo_state["selected_news"])
              estimated_saved_prompt_tokens = (
                  (source_full_tokens - factual_source_tokens) * factual_calls
                  + (selected_full_tokens - seo_selected_tokens) * seo_calls
              )
              variants[mode] = {
                  "source_context_chars_before": len(state["selected_news"]) + len(state["news_text"]),
                  "source_context_chars_after": factual_stats["context_chars_after"],
                  "source_context_char_reduction_pct": factual_stats["context_char_reduction_pct"],
                  "source_context_tokens_before_o200k": source_full_tokens,
                  "source_context_tokens_after_o200k": factual_source_tokens,
                  "source_context_token_reduction_pct": round(
                      (1 - factual_source_tokens / source_full_tokens) * 100, 1
                  ),
                  "seo_selected_tokens_before_o200k": selected_full_tokens,
                  "seo_selected_tokens_after_o200k": seo_selected_tokens,
                  "historical_factual_call_count": factual_calls,
                  "historical_seo_call_count": seo_calls,
                  "estimated_prompt_tokens_saved_static_replay": estimated_saved_prompt_tokens,
                  "estimated_baseline_prompt_reduction_pct_static_replay": round(
                      estimated_saved_prompt_tokens / baseline_prompt_tokens * 100, 1
                  ) if baseline_prompt_tokens else 0.0,
                  "used_evidence_indices": factual_stats["used_evidence_indices"],
              }

          report = {
              "schema_version": 2,
              "measurement_scope": (
                  "Offline deterministic replay of source-context payload only. Token estimates use "
                  "o200k_base and are not measured API billing/usage."
              ),
              "baseline_run_id": 32541706631,
              "target_date": target.isoformat(),
              "available_news_files": [path.name for path in available_files],
              "missing_news_dates": [value.isoformat() for value in missing_dates],
              "source_item_count": len(source_items),
              "selected_item_count": len(selection.get("items", [])),
              "declared_evidence_indices": declared_indices,
              "reconciled_evidence_indices": reconciled_indices,
              "evidence_reconciliation_changes": changes,
              "evidence_integrity": evidence_integrity,
              "historical_baseline_prompt_tokens": baseline_prompt_tokens,
              "historical_successful_step_counts": dict(successful_steps),
              "variants": variants,
          }
          output = Path(os.environ["RUN_ROOT"]) / "cost-replay.json"
          output.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Require model secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is required"; exit 1; }

      - name: Run conservative evidence-scoped agents on frozen news window
        id: build
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-nano' }}
          COST_CONTEXT_MODE: conservative
          SCRIPT_QUALITY_THRESHOLD: ${{ vars.SCRIPT_QUALITY_THRESHOLD || '8.7' }}
          JUDGE_THRESHOLD: ${{ vars.JUDGE_THRESHOLD || '8.5' }}
          VOICE_THRESHOLD: ${{ vars.VOICE_THRESHOLD || '8.7' }}
          MAX_REFINEMENT_ITERATIONS: ${{ vars.MAX_REFINEMENT_ITERATIONS || '5' }}
          MAX_SELECTED_NEWS: ${{ vars.MAX_SELECTED_NEWS || '8' }}
          SELECTION_HISTORY_DAYS: ${{ vars.SELECTION_HISTORY_DAYS || '30' }}
          ESSAY_HISTORY_DAYS: ${{ vars.ESSAY_HISTORY_DAYS || '120' }}
          MAX_RECENT_ESSAYS: ${{ vars.MAX_RECENT_ESSAYS || '12' }}
          ESSAY_DUPLICATE_THRESHOLD: ${{ vars.ESSAY_DUPLICATE_THRESHOLD || '0.42' }}
          MAX_NOVELTY_REPLANS: ${{ vars.MAX_NOVELTY_REPLANS || '2' }}
          TARGET_MIN_SECONDS: ${{ vars.TARGET_MIN_SECONDS || '420' }}
          TARGET_MAX_SECONDS: ${{ vars.TARGET_MAX_SECONDS || '1200' }}
          WORDS_PER_SECOND: ${{ vars.WORDS_PER_SECOND || '2.5' }}
          AGENT_MAX_ATTEMPTS: ${{ vars.AGENT_MAX_ATTEMPTS || '3' }}
          AGENT_RETRY_BASE_SECONDS: ${{ vars.AGENT_RETRY_BASE_SECONDS || '2.0' }}
          NEWS_SOURCE_MODE: recent_window
          NEWS_LOOKBACK_DAYS: ${{ steps.scenario.outputs.lookback_days }}
          DOWNLOAD_MULTIMEDIA: "false"
          TARGET_DATE: ${{ steps.scenario.outputs.target_date }}
          RUN_ROOT: ${{ steps.scenario.outputs.run_root }}
        run: |
          mkdir -p "$RUN_ROOT/scripts" "$RUN_ROOT/multimedia"
          python -m pipeline.run_cost_optimized \
            --target-date "$TARGET_DATE" \
            --scripts-dir "$RUN_ROOT/scripts" \
            --multimedia-dir "$RUN_ROOT/multimedia" \
            --history-scripts-dir scripts \
            --editorial-dir editorial \
            --max-media-downloads 0 \
            --no-download-multimedia

      - name: Print token and context telemetry
        if: always()
        env:
          TARGET_DATE: ${{ steps.scenario.outputs.target_date }}
          RUN_ROOT: ${{ steps.scenario.outputs.run_root }}
        run: |
          python - <<'PY'
          import json
          import os
          from collections import defaultdict
          from pathlib import Path

          path = Path(os.environ["RUN_ROOT"]) / "scripts" / os.environ["TARGET_DATE"] / "execution_trace.json"
          if not path.exists():
              print("No execution_trace.json available")
              raise SystemExit(0)
          trace = json.loads(path.read_text(encoding="utf-8"))
          by_step = defaultdict(lambda: {"prompt": 0, "output": 0, "total": 0, "calls": 0})
          for call in trace.get("agent_calls", []):
              if not isinstance(call, dict) or call.get("status") != "success":
                  continue
              usage = call.get("usage", {}) if isinstance(call.get("usage"), dict) else {}
              row = by_step[str(call.get("step", "unknown"))]
              row["calls"] += 1
              row["prompt"] += int(usage.get("prompt_tokens", 0) or 0)
              row["output"] += int(usage.get("output_tokens", 0) or 0)
              row["total"] += int(usage.get("total_tokens", 0) or 0)
              compact = call.get("context_compaction")
              if compact:
                  print(
                      f"COMPACTION {call.get('step')} iter={call.get('iteration')}: "
                      f"{compact.get('context_chars_before')} -> {compact.get('context_chars_after')} chars "
                      f"({compact.get('context_char_reduction_pct')}% reduction; "
                      f"mode={compact.get('mode')}; "
                      f"evidence={compact.get('used_evidence_indices')})"
                  )
          print("TOKEN SUMMARY")
          for step, row in sorted(by_step.items(), key=lambda pair: -pair[1]["total"]):
              print(step, row)
          print("TOTAL", {key: sum(row[key] for row in by_step.values()) for key in ("prompt", "output", "total")})
          PY

      - name: Evaluate current-runtime editorial structure
        id: regression
        if: always()
        continue-on-error: true
        env:
          TARGET_DATE: ${{ steps.scenario.outputs.target_date }}
          RUN_ROOT: ${{ steps.scenario.outputs.run_root }}
        run: |
          python -m pipeline.editorial_regression \
            --episode-dir "$RUN_ROOT/scripts/$TARGET_DATE" \
            --output "$RUN_ROOT/editorial-regression.json"

      - name: Print reviewable regression artifacts
        if: always()
        env:
          TARGET_DATE: ${{ steps.scenario.outputs.target_date }}
          RUN_ROOT: ${{ steps.scenario.outputs.run_root }}
        run: |
          if [ -f "$RUN_ROOT/cost-replay.json" ]; then
            echo "===== cost-replay.json ====="
            cat "$RUN_ROOT/cost-replay.json"
            echo
          fi
          for file in episode_plan.json script_sections.json reviews.json run_state.json script.txt; do
            path="$RUN_ROOT/scripts/$TARGET_DATE/$file"
            if [ -f "$path" ]; then
              echo "===== $file ====="
              cat "$path"
              echo
            fi
          done
          if [ -f "$RUN_ROOT/editorial-regression.json" ]; then
            echo "===== editorial-regression.json ====="
            cat "$RUN_ROOT/editorial-regression.json"
          fi

      - name: Upload regression artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-regression-${{ steps.scenario.outputs.target_date }}-${{ github.run_id }}
          path: ${{ steps.scenario.outputs.run_root }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail only on runtime/structural regression
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
        run: |
          echo "Build outcome: $BUILD_OUTCOME"
          echo "Regression outcome: $REGRESSION_OUTCOME"
          test "$BUILD_OUTCOME" = "success" || exit 1
          test "$REGRESSION_OUTCOME" = "success" || exit 1
