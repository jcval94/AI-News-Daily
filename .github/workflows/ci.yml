name: CI

on:
  pull_request:
    paths:
      - "app/**"
      - "pipeline/**"
      - "editorial/**"
      - "docs/**"
      - "evals/**"
      - "tests/**"
      - "requirements.lock"
      - "pyproject.toml"
      - "README.md"
      - "ROADMAP.md"
      - "AGENTS.md"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "pipeline/**"
      - "editorial/**"
      - "docs/**"
      - "evals/**"
      - "tests/**"
      - "requirements.lock"
      - "pyproject.toml"
      - "README.md"
      - "ROADMAP.md"
      - "AGENTS.md"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -c requirements.lock .
      - run: python -m compileall app pipeline
      - run: python -c "import app.agent, pipeline.run; print('runtime imports ok')"
      - run: python -m unittest discover -s tests -v
      - run: python -m pipeline.editorial_calibration --cases evals/editorial/cases.json --output /tmp/editorial-calibration.json
