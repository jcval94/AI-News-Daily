name: CI

on:
  pull_request:
    paths:
      - "app/**"
      - "pipeline/**"
      - "editorial/**"
      - "!editorial/narrative_memory.jsonl"
      - "docs/**"
      - "config/**"
      - "scripts/local/**"
      - "local_handoff/**"
      - "evals/**"
      - "experiments/media_retrieval_stress/**"
      - "tests/**"
      - "requirements.lock"
      - "pyproject.toml"
      - "README.md"
      - "ROADMAP.md"
      - "AGENTS.md"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "pipeline/**"
      - "editorial/**"
      - "!editorial/narrative_memory.jsonl"
      - "docs/**"
      - "config/**"
      - "scripts/local/**"
      - "local_handoff/**"
      - "evals/**"
      - "experiments/media_retrieval_stress/**"
      - "tests/**"
      - "requirements.lock"
      - "pyproject.toml"
      - "README.md"
      - "ROADMAP.md"
      - "AGENTS.md"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -c requirements.lock .
      - run: python -m compileall app pipeline
      - run: python -c "import app.agent, pipeline.run; print('runtime imports ok')"
      - run: python -m unittest discover -s tests -v
      - run: python -m pipeline.editorial_calibration --cases evals/editorial/cases.json --output /tmp/editorial-calibration.json

  windows-local-harness:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -c requirements.lock .
      - run: python -m compileall pipeline/local
      - run: python -m unittest discover -s tests/local -v
      - run: python -m pipeline.local operations
      - run: python -m pipeline.local audit --json-out harness-audit.json
      - name: Parse local PowerShell launchers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem scripts/local/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse failed: $($_.FullName)"
            }
          }
