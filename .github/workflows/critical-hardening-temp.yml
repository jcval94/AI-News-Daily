name: Temporary Critical Hardening

on:
  push:
    branches:
      - fix/critical-editorial-dedup-hardening
    paths:
      - tools/apply_critical_hardening.py
      - .github/workflows/critical-hardening-temp.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install .
      - name: Repair exact YAML patch fixture
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/apply_critical_hardening.py")
          text = path.read_text(encoding="utf-8")
          start_marker = "# CRITICAL 2 — production-script generation is part of the promotion invariant."
          end_marker = "# Update the mocked orchestration fixture"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          lines = [
              start_marker,
              "promotion_condition = (",
              "    \"steps.episode_outcome.outputs.status == 'approved' &&\\n\"",
              "    \"          steps.report.outcome == 'success' &&\\n\"",
              "    \"          steps.runtime_options.outputs.promote_approved == 'true'\"",
              ")",
              "promotion_condition_hardened = (",
              "    \"steps.episode_outcome.outputs.status == 'approved' &&\\n\"",
              "    \"          steps.production_script.outcome == 'success' &&\\n\"",
              "    \"          steps.report.outcome == 'success' &&\\n\"",
              "    \"          steps.runtime_options.outputs.promote_approved == 'true'\"",
              ")",
              "replace_count(",
              "    \".github/workflows/build-video-kit.yml\",",
              "    promotion_condition,",
              "    promotion_condition_hardened,",
              "    expected=2,",
              ")",
              "",
              "",
          ]
          replacement = "\n".join(lines)
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY
      - name: Apply scoped hardening
        run: python tools/apply_critical_hardening.py
      - name: Align writer contract regression assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_essay_first_contract.py")
          text = path.read_text(encoding="utf-8")
          old = 'Begin from the human observation/tension in episode_plan.hook, not from a headline'
          new = 'Begin from the human observation/tension in episode_plan.hook and narrative_arc.opening_belief / central_mystery, not from a headline'
          if text.count(old) != 1:
              raise RuntimeError(f"Expected one stale writer assertion, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Validate
        run: |
          python -m compileall app pipeline
          python -c "import app.agent, pipeline.run, pipeline.production_script; print('runtime imports ok')"
          python -m unittest discover -s tests -v
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/agent.py \
            pipeline/run.py \
            .github/workflows/build-video-kit.yml \
            tests/test_e2e_orchestration.py \
            tests/test_essay_first_contract.py \
            tests/test_selection_history.py \
            tests/test_promotion_guard.py
          git diff --cached --check
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "fix: harden dramaturgy promotion and covered-story history"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
