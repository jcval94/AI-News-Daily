name: Google Drive Raw Bridge Probe

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - ".github/workflows/gdrive-raw-bridge-probe.yml"

permissions:
  contents: write

concurrency:
  group: gdrive-raw-bridge-probe
  cancel-in-progress: false

jobs:
  consume:
    runs-on: ubuntu-latest
    env:
      INBOX_FOLDER_ID: 1bPEr91j4HDGihnDbcCtoBPFWCW2RPYQ_
      PROCESSED_FOLDER_ID: 1o-2WPz514dFJDg7seGz2dZ4X87doPkdK
      FAILED_FOLDER_ID: 1m03IN_GY0rJgpz_gXtwm1by91GcSOuZz
      FILE_PREFIX: ai-news-daily__scheduled-e2e-probe__2026-10-01-1630
      ALLOWED_TARGET_PREFIX: bridge-consumed/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Drive credential
        shell: bash
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "${GDRIVE_SERVICE_ACCOUNT_JSON:-}" ]]; then
            echo "::error::Missing required secret: GDRIVE_SERVICE_ACCOUNT_JSON"
            exit 2
          fi

      - name: Install Google auth client
        shell: bash
        run: python -m pip install --disable-pip-version-check --quiet google-auth requests

      - name: Mint Google Drive token from service-account key
        id: auth
        shell: bash
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          info = json.loads(os.environ["GDRIVE_SERVICE_ACCOUNT_JSON"])
          creds = service_account.Credentials.from_service_account_info(
              info,
              scopes=["https://www.googleapis.com/auth/drive"],
          )
          creds.refresh(Request())
          token = creds.token
          print(f"::add-mask::{token}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              print(f"access_token={token}", file=out)
          PY

      - name: Select probe payload
        id: select
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          token="$ACCESS_TOKEN"
          echo "::add-mask::$token"
          query="'$INBOX_FOLDER_ID' in parents and trashed=false and mimeType='text/plain' and name contains '$FILE_PREFIX'"
          curl --fail-with-body -sS -G \
            -H "Authorization: Bearer $token" \
            --data-urlencode "q=$query" \
            --data-urlencode "fields=files(id,name,createdTime,parents,mimeType)" \
            --data-urlencode "orderBy=createdTime asc" \
            --data-urlencode "pageSize=10" \
            "https://www.googleapis.com/drive/v3/files" > /tmp/drive-list.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('/tmp/drive-list.json').read_text())
          files = data.get('files', [])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              if files:
                  f = files[0]
                  print(f"file_id={f['id']}", file=out)
                  print(f"file_name={f['name']}", file=out)
              else:
                  print("file_id=", file=out)
                  print("file_name=", file=out)
          PY

      - name: Download probe TXT
        if: steps.select.outputs.file_id != ''
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          token="$ACCESS_TOKEN"
          echo "::add-mask::$token"
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $token" \
            "https://www.googleapis.com/drive/v3/files/${{ steps.select.outputs.file_id }}?alt=media" \
            -o /tmp/bridge-envelope.txt

      - name: Validate and materialize probe
        if: steps.select.outputs.file_id != ''
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - "$GITHUB_REPOSITORY" "$ALLOWED_TARGET_PREFIX" <<'PY'
          import base64, hashlib, json, pathlib, sys

          expected_repo, allowed_prefix = sys.argv[1], sys.argv[2]
          lines = pathlib.Path('/tmp/bridge-envelope.txt').read_text(encoding='utf-8').splitlines()
          env = {}
          for raw in lines:
              line = raw.strip()
              if not line:
                  continue
              if '=' not in line:
                  raise SystemExit(f"Malformed envelope line: {line!r}")
              key, value = line.split('=', 1)
              if key in env:
                  raise SystemExit(f"Duplicate key: {key}")
              env[key] = value

          required = {'format','sha256','target_repo','target_path','payload_b64'}
          missing = required - env.keys()
          if missing:
              raise SystemExit(f"Missing fields: {sorted(missing)}")
          if env['format'] != 'base64-json-v1':
              raise SystemExit("Unsupported format")
          if env['target_repo'] != expected_repo:
              raise SystemExit(f"target_repo mismatch: {env['target_repo']} != {expected_repo}")

          target = pathlib.PurePosixPath(env['target_path'])
          if target.is_absolute() or '..' in target.parts:
              raise SystemExit("Unsafe target_path")
          if not env['target_path'].startswith(allowed_prefix) or target.suffix != '.json':
              raise SystemExit("Probe target_path outside isolated bridge-consumed/")
          payload = base64.b64decode(env['payload_b64'], validate=True)
          actual_sha = hashlib.sha256(payload).hexdigest()
          if actual_sha != env['sha256']:
              raise SystemExit("SHA mismatch")

          data = json.loads(payload.decode('utf-8'))
          if data.get('target_repo') != expected_repo:
              raise SystemExit("Decoded target_repo mismatch")
          if data.get('target_path') != env['target_path']:
              raise SystemExit("Decoded target_path mismatch")
          if data.get('marker') != 'AI_NEWS_GDRIVE_RAW_TXT_SCHEDULED_E2E_2026-10-01_1630':
              raise SystemExit("Marker mismatch")
          if data.get('status') != 'ready':
              raise SystemExit("status must be ready")

          out = pathlib.Path(env['target_path'])
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(payload + b'\n')
          print(f"validated={out} sha256={actual_sha}")
          PY

      - name: Move invalid payload to failed
        if: steps.select.outputs.file_id != '' && steps.validate.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          token="$(gcloud auth print-access-token)"
          curl --fail-with-body -sS -X PATCH -G \
            -H "Authorization: Bearer $token" \
            --data-urlencode "addParents=$FAILED_FOLDER_ID" \
            --data-urlencode "removeParents=$INBOX_FOLDER_ID" \
            --data-urlencode "fields=id,name,parents" \
            "https://www.googleapis.com/drive/v3/files/${{ steps.select.outputs.file_id }}" >/dev/null

      - name: Fail invalid payload
        if: steps.select.outputs.file_id != '' && steps.validate.outcome == 'failure'
        run: exit 1

      - name: Commit materialized probe
        if: steps.select.outputs.file_id != '' && steps.validate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bridge-consumed/
          if git diff --cached --quiet; then
            echo "Probe already materialized; no commit needed."
          else
            git commit -m "test: consume Drive raw bridge probe 16:30"
            git push
          fi

      - name: Move successful payload to processed
        if: steps.select.outputs.file_id != '' && steps.validate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          token="$(gcloud auth print-access-token)"
          curl --fail-with-body -sS -X PATCH -G \
            -H "Authorization: Bearer $token" \
            --data-urlencode "addParents=$PROCESSED_FOLDER_ID" \
            --data-urlencode "removeParents=$INBOX_FOLDER_ID" \
            --data-urlencode "fields=id,name,parents" \
            "https://www.googleapis.com/drive/v3/files/${{ steps.select.outputs.file_id }}" >/dev/null

      - name: Idle
        if: steps.select.outputs.file_id == ''
        run: echo "No 16:30 probe payload found yet."
