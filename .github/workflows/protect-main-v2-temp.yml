name: Temporary Protect Main V2

on:
  push:
    branches:
      - fix/high-1-4-editorial-stabilization
    paths:
      - ".github/workflows/protect-main-v2-temp.yml"

permissions:
  contents: write

jobs:
  protect-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/high-1-4-editorial-stabilization
          fetch-depth: 0
      - name: Attempt real branch protection
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p .e2e-review
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          url = f"https://api.github.com/repos/{os.environ['REPO']}/branches/main/protection"
          payload = {
              "required_status_checks": {"strict": True, "contexts": ["deterministic-tests"]},
              "enforce_admins": False,
              "required_pull_request_reviews": {
                  "dismiss_stale_reviews": False,
                  "require_code_owner_reviews": False,
                  "required_approving_review_count": 0,
              },
              "restrictions": None,
              "allow_force_pushes": False,
              "allow_deletions": False,
          }
          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode(),
              method="PUT",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          result = {"attempted": True, "requested": payload}
          try:
              with urllib.request.urlopen(request) as response:
                  result.update({"success": True, "http_status": response.status, "response": json.loads(response.read().decode())})
          except urllib.error.HTTPError as exc:
              body = exc.read().decode()
              try: body = json.loads(body)
              except Exception: pass
              result.update({"success": False, "http_status": exc.code, "response": body})
          with open('.e2e-review/branch-protection.json', 'w', encoding='utf-8') as handle:
              json.dump(result, handle, indent=2)
              handle.write('\n')
          print(json.dumps({k:v for k,v in result.items() if k != 'requested'}, indent=2))
          PY
      - name: Persist result for review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .e2e-review/branch-protection.json
          git commit -m "test: record main branch protection attempt"
          git pull --rebase origin fix/high-1-4-editorial-stabilization
          git push origin HEAD:fix/high-1-4-editorial-stabilization
